[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astroos"
version = "2.0.0"
dependencies = [
    "weasyprint>=60.0",
    "prometheus-client>=0.20.0",
    "jinja2>=3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
markers = [
    "regression: Golden-reference benchmark regression tests.",
    "integration: Tests requiring a live database or external dependencies.",
]

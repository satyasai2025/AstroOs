  - graha: graha.ketu
    rashis:
      mesha: { status: friendly }
      vrishabha: { status: neutral }
      mithuna: { status: enemy }
      karka: { status: enemy }
      simha: { status: enemy }
      kanya: { status: enemy }
      tula: { status: neutral }
      vrishchika: { status: friendly, note: "Treated as co-lord alongside Mangala in some systems" }
      dhanus: { status: friendly, note: "Some traditions treat this as Ketu's exaltation sign" }
      makara: { status: neutral }
      kumbha: { status: neutral }
      meena: { status: friendly, note: "Treated as co-lord alongside Shukra in some systems" }

data_quality_note: >
  While building this matrix, an internal inconsistency was found and
  corrected in catalogues/grahas/chandra.yaml (v1.0 to v1.1): its
  relationships field listed zero enemies, but its avastha.inimical_signs
  listed four signs owned by grahas Chandra treats as neutral. This has
  been reconciled; the matrix above reflects the corrected data. The
  other seven sign-owning grahas were spot-checked and found internally
  consistent (their inimical_signs match exactly the signs owned by
  their listed enemy grahas).

sources:
  - ref: source.BPHS
    claim: "Graha dignity in rashis: exaltation, debilitation, moolatrikona, and own-sign points, Chapter 3-4"
    confidence: high

notes: >
  This matrix is the reciprocal view of data already present in each
  graha's individual catalogue record (catalogues/grahas/*.yaml,
  avastha block). It exists so a practitioner can look up "what is
  every graha's dignity in Tula?" without opening nine separate files.
  Rahu and Ketu have no classically-universal exaltation/debilitation/
  moolatrikona/own-sign assignments; the alternate traditions noted
  above (Rahu in Vrishabha or Mithuna, Ketu in Dhanus) are documented
  but not treated as primary in this knowledge base, consistent with
  catalogues/grahas/rahu.yaml and catalogues/grahas/ketu.yaml.


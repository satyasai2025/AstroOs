  - graha: graha.rahu
    rashis:
      mesha: { status: enemy }
      vrishabha: { status: friendly, note: "Some traditions treat this as Rahu's exaltation sign" }
      mithuna: { status: neutral, note: "Some traditions treat this as Rahu's exaltation sign; co-lord of Kanya in some systems does not apply here" }
      karka: { status: enemy }
      simha: { status: enemy }
      kanya: { status: neutral, note: "Treated as co-lord alongside Budha in some systems" }

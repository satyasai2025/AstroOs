significance: >
  The Yavana Jataka is the earliest surviving Sanskrit text on
  Hellenistic astrology. It represents the transmission of Greek
  astrological concepts into India and the synthesis that produced
  classical Jyotish.

notes: >
  Historical source. Important for understanding the development
  of Jyotish rather than for standard Parashari practice. David
  Pingree's critical edition is the standard reference.


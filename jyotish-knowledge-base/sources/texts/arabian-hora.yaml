notes: "The Arabian Hora corpus represents a significant phase of cross-cultural transmission of astrological knowledge between the Islamic world and India (c. 800 CE onward). These translations introduced Persian-Arabic techniques such as the Tajika system and annual horoscopy into the Sanskrit astrological tradition. The exact titles and translators remain largely anonymous."


significance: "Phaladeepika (Light on Results) is one of the most popular and practical Jyotish texts among modern practitioners. Its 28 chapters provide a systematic, verse-by-verse exposition of Parashari horoscopy with a strong emphasis on practical prediction. The text is particularly valued for its lucid presentation of bhava interpretation, its comprehensive yoga catalog, and its clear Dasha timing principles. Mantreshwara's work is considered the culmination of the classical Parashari textual tradition."

notes: "Little is known about Mantreshwara beyond the text itself. He is believed to have lived in south India, possibly in the Andhra region, based on linguistic and cultural references in the work. The date of ~1300 CE is traditional; some scholars place him as late as 1500 CE. Multiple commentaries on Phaladeepika exist, with those by N. Subrahmanyam Sastri and by G.S. Kapoor being among the most studied."


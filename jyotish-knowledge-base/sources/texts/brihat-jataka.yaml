significance: "Brihat Jataka is Varahamihira's magnum opus on horoscopy and the most extensively commented-upon Jyotish text after BPHS. Composed in elegant Sanskrit verse, it synthesizes earlier Siddhantic and Parashari traditions with Hellenistic astrological concepts into a coherent classical system. The text's clarity, conciseness, and comprehensive scope made it the standard curriculum text for Jyotish study across India for over a millennium."

notes: "Varahamihira (fl. 505–587 CE) was one of the Navaratnas at the court of the Gupta emperor Vikramaditya. His works include Panchasiddhantika (five astronomical systems), Brihat Samhita (encyclopedia of omens and natural astrology), and three astrological texts. The earliest extant commentary on Brihat Jataka is by Bhattotpala (10th century CE). Some verses on marriage compatibility and timing techniques require contextual understanding of medieval social norms."


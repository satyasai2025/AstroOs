significance: "Uttara Kalamrita is a concise yet comprehensive classical Parashari text that focuses on practical predictive methodology. Its 12 chapters cover the essential topics of horoscopy with particular emphasis on birth time rectification, graha effects in houses, and Dasha interpretation. The text is especially valued by practitioners for its clear, systematic approach to synthesizing multiple chart factors in prediction."

notes: "Whether the Kalyanavarma who authored Uttara Kalamrita is the same as the Kalyanavarma of Saravali is a matter of scholarly debate. Linguistic and stylistic differences suggest they may be different individuals separated by several centuries. Uttara Kalamrita is sometimes grouped with Purva Kalamrita (a lost or lesser-known text) as parts of a larger Kalamrita tradition. The Chandrika commentary is important for understanding the text's interpretative tradition."


# === NOTES ===

notes: >
  Shani is the son of Surya and Chhaya and serves as the celestial
  judge, dispensing karmic justice based on one's actions. Despite
  being a natural malefic, Shani's influence is not inherently
  negative - it disciplines, teaches patience, and rewards sustained
  effort. Shani transits one sign every 2.5 years and its Sade Sati
  (7.5-year transit over the natal Moon) is one of the most
  significant transit periods in Jyotish. Its moolatrikona in Kumbha
  reflects its role as the lord of service and humanitarianism.


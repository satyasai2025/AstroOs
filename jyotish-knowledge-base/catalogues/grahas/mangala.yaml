# === NOTES ===

notes: >
  Mangala is the commander of the celestial army and represents
  the fiery, assertive energy in the chart. As a natural malefic
  ruling Mesha and Vrishchika, it governs courage, ambition, and
  technical skill. A strong Mangala indicates leadership potential,
  while an afflicted Mangala may manifest as aggression or conflict.
  Mangala owns the 3rd and 8th houses naturally (in Mesha lagna).


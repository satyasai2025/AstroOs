  notes: >
    Ketu is not a physical body but a mathematical point — the
    lunar node where the Moon's orbit crosses the ecliptic
    from north to south. It is always retrograde and completes
    one zodiac cycle in approximately 18.6 years, occupying the
    exact opposite point from Rahu.


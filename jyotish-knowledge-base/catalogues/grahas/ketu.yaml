# === NOTES ===

notes: >
  Ketu is the severed headless body of the demon Svarbhanu and
  represents the moksha (liberation) kartaka among the grahas.
  As a shadow graha with no physical form, Ketu governs
  spirituality, detachment, past-life karma, and hidden
  knowledge. It is associated with sharp wisdom, healing,
  and sudden flashes of insight. Whereas Rahu pursues worldly
  desires, Ketu liberates from them. Its 7-year dasha often
  coincides with spiritual growth, upheaval, or withdrawal
  from material life. Ketu rules the three nakshatras known
  for their sharp, healing, or destructive energies.


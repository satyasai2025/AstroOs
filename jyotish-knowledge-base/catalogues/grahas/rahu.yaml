  notes: >
    Rahu is not a physical body but a mathematical point — the
    lunar node where the Moon's orbit crosses the ecliptic
    from south to north. It moves retrograde at approximately
    19.4 degrees per year, completing one zodiac cycle in
    about 18.6 years.


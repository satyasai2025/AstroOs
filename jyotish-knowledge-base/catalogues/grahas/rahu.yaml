# === NOTES ===

notes: >
  Rahu is the severed head of the demon Svarbhanu, who became
  immortal after drinking the nectar of the gods. As a shadow
  graha (chhaya graha), Rahu has no physical body but exerts
  a powerful karmic influence. It amplifies whatever sign and
  house it occupies, often manifesting through obsession,
  sudden transformation, and worldly ambition. Rahu rules the
  materialistic, unconventional, and technologically innovative
  dimensions of life. Its dasha of 18 years often coincides with
  periods of intense karmic reckoning and material pursuit.


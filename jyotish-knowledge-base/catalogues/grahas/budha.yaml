# === NOTES ===

notes: >
  Budha is the prince of the grahas and rules over intellect,
  communication, and commerce. As a natural neutral, its effect
  depends heavily on association: it becomes benefic when conjoined
  with benefic grahas and malefic with malefic grahas. Budha rules
  both Mithuna and Kanya, making it the only graha with a dual-ruled
  sign where one (Kanya) is also its exaltation and moolatrikona.
  Its retrograde cycles are the most frequent among all grahas.


  - description: "Ittalaqa between malefic planets in challenging houses indicates year's difficulties"
    intensity: strong
  - description: "Sahama of wealth in a favorable position indicates financial gains during the year"
    intensity: moderate
  - description: "Tajika yogas must be evaluated in conjunction with natal promises and ongoing Dasha"
    intensity: moderate


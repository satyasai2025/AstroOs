    confidence: high

notes: >
  Key Tajika yoga principles: (1) Ittalaqa is the fundamental Tajika combination —
  when two planets are in conjunction or aspect each other in the annual chart,
  the nature of their relationship determines the outcome. (2) Benefic Ittalaqa
  (e.g., Jupiter-Sun conjunction) is generally favorable. (3) Malefic Ittalaqa
  (e.g., Saturn-Mars conjunction) is generally unfavorable. (4) Mixed Ittalaqa
  requires examining house ownership and placement. (5) Sahama points are
  calculated for specific topics: wealth (Dhana Sahama), children (Putra Sahama),
  etc. (6) The strength of a Tajika yoga depends on the dignity and house
  placement of the participating planets. (7) Tajika yogas in the annual chart
  are evaluated separately from natal yogas — both are considered together for
  annual predictions. (8) The orb of aspect in Tajika is typically limited to
  the exact same Rashi or within a close degree range.


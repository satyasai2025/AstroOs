  - entity: graha.conjunction
    role: subject
    detail: "Ittalaqa: conjunction or aspect between two planets in the annual chart"

  - entity: sahama.point
    role: framework
    detail: "Sahama: derived points calculated from natal and annual positions for specific life areas"

effects:

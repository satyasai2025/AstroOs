system: tajika
statement: >
  Tajika yogas are planetary combinations specific to the Tajika system that
  differ from Parashari yogas. The primary Tajika yoga is Ittalaqa (conjunction
  or aspect between planets in the annual chart), where the nature and strength
  of the aspect determines outcomes. Sahama (derived house points) provides
  additional combination analysis. Tajika yogas are evaluated within the annual
  chart context and use the same aspect system (7th-house aspect only, with
  orb considerations) rather than Parashari's multiple aspects.


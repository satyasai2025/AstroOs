    confidence: high

notes: >
  The KP cuspal house system uses Placidus house cusps. Key rules: (1) A
  planet occupies the house in which its longitude falls, measured from
  cusp to cusp. (2) A planet rules the house whose cusp falls in its
  Rashi — this may be different from the house it occupies. (3) When
  occupation and ownership differ, both roles are considered. (4) Planets
  within approximately 5 degrees before a cusp act as ruling planets of
  the house whose cusp is approaching; those within approximately 5 degrees
  after a cusp may also influence the previous house. (5) The cuspal
  sub-lord is the single most critical factor — it determines whether
  the house's promise will be fulfilled.


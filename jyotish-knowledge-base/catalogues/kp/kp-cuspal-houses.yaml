system: kp
statement: >
  In KP, houses extend from cusp to cusp rather than following the whole-sign
  (Rashi) system. Each house begins at its cusp (the exact degree where the
  house boundary is calculated) and extends to the cusp of the next house.
  A planet's house placement is determined by where it falls between cusps,
  not by which Rashi it occupies. The cuspal sub-lord (not the Rashi lord)
  governs the house's event domain. Cusps are calculated using the Placidus
  (or equal arc) system and are sensitive to time and place of birth.


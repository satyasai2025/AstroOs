notes: >
  Bhrigu Nandi Nadi (BNN) is a predictive system attributed to the sage Bhrigu
  and transmitted through the Nadi leaf manuscripts. Its three pillars are:
  (1) Nakshatra-based principles where predictions are derived from planetary
  nakshatra positions rather than sign positions, (2) Unique planetary combinations
  (Nadi yogas) that produce deterministic life-pattern predictions, and
  (3) Nakshatra-based timing that identifies when events will manifest through
  transit analysis rather than standard Dasha systems. BNN operates independently
  of mainstream Parashari Jyotish and can be used as a standalone prediction
  system or as a cross-verification tool.


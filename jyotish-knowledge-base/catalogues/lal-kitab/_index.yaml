notes: >
  Lal Kitab was authored by Pandit Roop Chand Joshi and first published in
  1939 (Urdu) and 1941 (Hindi/Punjabi). Its three pillars are: (1) Fixed
  house significations that differ from classical Jyotish, (2) A unique
  sitting-aspecting planetary effect framework, and (3) Practical, accessible
  remedies for everyday life. Lal Kitab is distinctive for its emphasis on
  actionable solutions and its rejection of elaborate ritual requirements.


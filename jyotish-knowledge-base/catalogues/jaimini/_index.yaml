id: jaimini._index
name: "Jaimini System Index"
category: jaimini
status: active
confidence: high
version: 1.3
last_verified: 2026-07-16

description: |
  Index of all Jaimini-system records catalogued in the Jyotish
  Knowledge Base. The Jaimini system is a distinct tradition of
  Jyotish astrology, attributed to the sage Jaimini, that operates
  on principles different from the Parashari system. Key
  distinguishing features include:
  - Chara Karaka system (dynamic significators based on degrees)
  - Rashi-based dasha systems (Chara Dasha)
  - Rashi drishti (sign-level aspects rather than graha aspects)
  - Karakamsha chart (soul-purpose analysis)
  - Argala (intervention/obstruction mechanics)

records:
  - id: jaimini.karakamsha.chart
    name: Karakamsha Chart
    type: divisional-chart
    file: karakamsha.yaml
    description: >
      The chart where the Atmakaraka's D-9 position becomes the
      Lagna. Reveals soul purpose and karmic direction.
    source: "Jaimini Sutras Ch.1"

  - id: jaimini.chara-dasha.rules
    name: Chara Dasha Viddhi
    type: dasha-rules
    file: chara-dasha-rules.yaml
    description: >
      Detailed rules for the Chara Dasha system: variable-length
      rashi periods (movable 2yr, fixed 5yr, dual 7yr) starting
      from the Atmakaraka.
    source: "Jaimini Sutras Ch.2"

  - id: jaimini.rashi-drishti.complete
    name: Jaimini Rashi Drishti Purna
    type: aspect-table
    file: jaimini-aspects.yaml
    description: >
      Complete rashi-to-rashi aspect table. Movable aspects fixed
      (non-adjacent), fixed aspects movable, dual aspects dual.
    source: "Jaimini Sutras Ch.2"

  - id: jaimini.chara-karakas.system
    name: Chara Karaka Paddhati
    type: karaka-system
    file: jaimini-karakas.yaml
    description: >
      The Chara Karaka system: 8 dynamic significators (AK through
      DK) determined by planetary degree positions.
    source: "Jaimini Sutras Ch.1"

  - id: jaimini.yogas.collection
    name: Jaimini Yoga Samuha
    type: yoga-collection
    file: jaimini-yogas.yaml
    description: >
      Jaimini-specific yogas: Rajayoga from karaka conjunctions,
      karakamsha lagna yogas, argala-based yogas.
    source: "Jaimini Sutras"

  - id: jaimini.chara-karaka-system
    name: Chara Karaka System
    type: karaka-system-overview
    file: chara-karaka-system.yaml
    description: >
      Complete overview of the Chara Karaka system: 8 significators
      (AK through DK) assigned by planetary degree ranking, with
      rules and significance details.
    source: "Jaimini Sutras Ch.1"

  - id: jaimini.atmakaraka-role
    name: Atmakaraka Role in Jaimini
    type: karaka-role-analysis
    file: atmakaraka-role.yaml
    description: >
      Detailed analysis of the Atmakaraka (AK): house placement
      effects, dignity effects, and key principles governing its
      role as the soul significator.
    source: "Jaimini Sutras Ch.1"

  - id: jaimini.chara-karaka-effects
    name: Chara Karaka Effects by Graha
    type: karaka-effects-table
    file: chara-karaka-effects.yaml
    description: >
      Effects when each of the 9 grahas occupies a chara karaka
      role (AK through DK). Covers natural quality interactions
      with karaka significations.
    source: "Jaimini Sutras Ch.1"

  - id: jaimini.chara-dasha-system
    name: Chara Dasha System
    type: dasha-system-overview
    file: chara-dasha-system.yaml
    description: >
      Overview of the Chara Dasha system: rashi-based dasha
      periods assigned based on position from the Atmakaraka's
      sign, with counting direction determined by sign parity.
    source: "Jaimini Sutras Ch.2"

  - id: jaimini.chara-dasha-calculator
    name: Chara Dasha Calculation Method
    type: dasha-calculation-guide
    file: chara-dasha-calculator.yaml
    description: >
      Step-by-step calculation method for Chara Dasha periods,
      including direction rules, counting mechanics, and worked
      example with AK in Mesha.
    source: "Jaimini Sutras Ch.2"

  - id: jaimini.chara-dasha-effects
    name: Chara Dasha Period Effects
    type: dasha-effects-table
    file: chara-dasha-effects.yaml
    description: >
      General effects of Chara Dasha periods for all 12 rashis
      as dasha lords, covering positive outcomes, negative
      tendencies, and karaka energy themes.
    source: "Jaimini Sutras Ch.2"

  - id: jaimini.rashi-drishti
    name: Rashi Drishti (Sign Aspects)
    type: aspect-table
    file: rashi-drishti.yaml
    description: >
      Rashi Drishti system: 5 aspects per sign (7th, 2nd, 12th,
      4th, 8th) with aspect strength hierarchy (strongest to weakest).
    source: "Jaimini Sutras Ch.2"

  - id: jaimini.arudha-padas
    name: Arudha Pada System
    type: arudha-system
    file: arudha-padas.yaml
    description: >
      Reflected house positions (A1-A12) showing how the world
      perceives each life area. Includes calculation method and
      special rules for same-house fallback.
    source: "Jaimini Sutras"


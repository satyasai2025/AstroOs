system_overview: |
  The Jaimini system, as documented in these five core records,
  operates on the following principles:

  1. KARAKA (Significator): The chara karaka system assigns life-area
     significations dynamically based on planetary degrees. AK
     (Atmakaraka) is the primary karaka.

  2. KARAKAMSHA (Soul Chart): The AK's D-9 position becomes the
     Lagna of a special chart for soul-level analysis.

  3. DASHA (Timing): Chara Dasha uses rashi-based periods with
     variable durations based on sign nature, starting from the AK.

  4. DRISHTI (Aspect): Rashi drishti creates sign-to-sign aspect
     relationships independent of graha placement.

  5. YOGA (Combination): Jaimini yogas arise from karaka
     conjunctions, Karakamsha configurations, and argala mechanics.

  These five pillars work together: the karaka system identifies
  which grahas signify which life areas; the Karakamsha chart
  provides soul-level context; Chara Dasha times events; rashi
  drishti creates structural relationships; and Jaimini yogas
  indicate specific outcomes.

sources:
  - ref: source.jaimini-sutras
    claim: >
      Jaimini Sutras — the foundational text of the Jaimini system,
      attributed to the sage Jaimini. Chapters 1 and 2 provide the
      core principles documented in these catalogue entries.
    confidence: high

notes: |
  This index covers the core pillars of the Jaimini system
  as documented in the Jaimini Sutras. The catalogue now includes
  13 records spanning karaka system, dasha system, aspects (rashi
  drishti), yogas, arudha padas, and soul-chart analysis. Additional
  Jaimini concepts (such as Karakamsha bhava analysis, Argala
  detailed mechanics, Upapada Lagna, and specific conditional rules)
  may be added in future catalogue entries.

  The Jaimini system is meant to be used alongside, not instead of,
  the Parashari system. Both traditions complement each other and
  a comprehensive Jyotish analysis typically incorporates both
  frameworks.

  IMPORTANT: These records are Jaimini-system specific. They do
  NOT mix with Parashari principles. Each record cites Jaimini
  Sutras as its primary source.


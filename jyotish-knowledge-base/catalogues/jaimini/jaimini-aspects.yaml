system: jaimini
type: rashi-drishti

statement: >
  In the Jaimini system, rashis (signs) aspect each other based on
  their nature rather than graha placement. Movable (chara) signs
  aspect all fixed (sthira) signs except the immediately adjacent
  fixed sign. Fixed signs aspect all movable signs. Dual
  (dvisvabhava) signs aspect all other dual signs. Each rashi
  aspects exactly three other rashis, producing a uniform
  three-aspect-per-rashi pattern.

conditions:
  - entity: rashi.chara
    role: subject
    notes: >
      Movable rashis: Mesha (1), Karka (4), Tula (7), Makara (10).
      Each aspects all fixed rashis except the one immediately
      adjacent in the zodiacal sequence (zodiacally following).
  - entity: rashi.sthira
    role: subject
    notes: >
      Fixed rashis: Vrishabha (2), Simha (5), Vrischika (8),
      Kumbha (11). Each aspects all movable rashis.
  - entity: rashi.dvisvabhava
    role: subject
    notes: >
      Dual rashis: Mithuna (3), Kanya (6), Dhanu (9), Meena (12).
      Each aspects all other dual rashis (three targets each).

effects:
  - description: >
      Rashi drishti creates structural associations between rashis
      independent of graha placement. These aspects are always
      active and form the background influence layer of the chart.
    intensity: moderate
  - description: >
      When a graha occupies a rashi, it inherits that rashi's
      aspect relationships, extending the graha's influence to
      grahas in the aspected rashis.
    intensity: moderate
  - description: >
      Rashi drishti interacts with graha drishti (Parashari aspects)
      to create layered influence patterns in the chart.
    intensity: mild


adjacent_exceptions: |
  The following adjacent pairs are NOT in aspect relationship:

  Movable -> Fixed (adjacent, excluded):
    - Mesha (1) does NOT aspect Vrishabha (2)
    - Karka (4) does NOT aspect Simha (5)
    - Tula (7) does NOT aspect Vrischika (8)
    - Makara (10) does NOT aspect Kumbha (11)

  Fixed -> Movable (preceding, excluded):
    - Vrishabha (2) does NOT aspect Mesha (1)
    - Simha (5) does NOT aspect Karka (4)
    - Vrischika (8) does NOT aspect Tula (7)
    - Kumbha (11) does NOT aspect Makara (10)

  Dual -> Dual: No adjacent exceptions.
    All dual signs aspect all other dual signs without exclusion.


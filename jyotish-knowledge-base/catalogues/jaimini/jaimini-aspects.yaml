notes: |
  Rashi drishti is a Jaimini-system concept and must not be
  confused with Parashari graha drishti. The two systems are
  independent and additive.

  Practical Application:
  When analyzing a chart, rashi drishti tells you which signs
  "communicate" with each other structurally. A graha in a rashi
  inherits that rashi's aspects. For example, if Mangala (Mars)
  is in Mesha, Mangala aspects grahas in Simha, Vrischika, and
  Kumbha through rashi drishti — in addition to its own Parashari
  aspects (4th, 7th, 8th from its position).

  This table is the complete reference for all rashi-to-rashi
  aspect relationships in the Jaimini system. Each rashi aspects
  exactly three other rashis, creating a uniform three-aspect
  pattern across all twelve signs.


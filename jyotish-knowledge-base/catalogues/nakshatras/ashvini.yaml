notes: >
  Ashvini is the first nakshatra, spanning the opening 13°20' of Mesha.
  Ruled by Ketu in the Vimshottari system, it is presided over by the
  Ashwini Kumaras, the twin divine physicians known for their speed and
  healing abilities. All four padas fall within Mesha with navamsha
  progression through Mesha-Vrishabha-Mithuna-Karka. As a deva-gana,
  sattvic nakshatra with a quick temperament, it bestows pioneering
  energy, healing gifts, and the capacity for swift action.


notes: >
  Uttara Phalguni is the twelfth nakshatra, spanning from late Simha
  into early Kanya (26°40' Simha to 10° Kanya). Ruled by Surya in
  the Vimshottari system, it is presided over by Aryaman, the god of
  patronage and social bonds. Its shakti is the power of patronage.
  The first pada falls in Simha with Mesha navamsha; padas two through
  four are in Kanya with Vrishabha-Mithuna-Karka navamsha. As a
  manushya-gana, tamasic nakshatra with a generous and protective
  temperament, it bestows the capacity for loyal patronage, stable
  friendships, and protective generosity.


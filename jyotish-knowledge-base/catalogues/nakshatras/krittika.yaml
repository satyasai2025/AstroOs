notes: >
  Krittika is the third nakshatra, ruled by Surya and presided over
  by Agni, the god of fire. Its shakti is the power of burning
  (dahana), enabling sharp discrimination and the ability to cut
  through illusion. As a rakshasa-gana nakshatra with sharp
  temperament, it bestows courage, piercing intellect, and the
  capacity for radical transformation. The first pada is in Mesha,
  the remaining three in Vrishabha.


notes: >
  Purva Phalguni is the eleventh nakshatra, the second in Simha,
  spanning 13°20' to 26°40' Simha. Ruled by Shukra in the Vimshottari
  system, it is presided over by Bhaga, the god of fortune and shared
  enjoyment. Its shakti is the power of procreation and rest. All four
  padas reside in Simha with navamsha progression through Dhanus-
  Makara-Kumbha-Meena. As a manushya-gana, rajasic nakshatra with a
  creative and playful temperament, it bestows artistic talent,
  romantic charm, and the capacity for joyful creation and social
  enjoyment.


notes: >
  Ardra is the sixth nakshatra, entirely within Mithuna (6°40' to 20°
  Mithuna). Ruled by Rahu in the Vimshottari system, it is presided
  over by Rudra, the fierce storm form of Shiva. Its shakti is the
  power to moisten through tears of transformation. All four padas
  reside in Mithuna with navamsha progression through Makara-Kumbha-
  Meena-Mesha. As a manushya-gana, tamasic nakshatra with a stormy
  temperament, it brings upheaval, destruction, and the painful but
  necessary transformation that follows.


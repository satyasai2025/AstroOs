notes: >
  Bharani is the second nakshatra, ruled by Shukra and presided over
  by Yama, the god of death and dharma. Its shakti is the power of
  bearing away or cleansing (apabharani), reflecting themes of
  purification through confronting limitations and mortality.
  Natives of this nakshatra often exhibit endurance, responsibility,
  and a capacity to carry heavy karmic burdens.


notes: >
  Magha is the tenth nakshatra, the first in Simha, spanning 0° to
  13°20' Simha. Ruled by Ketu in the Vimshottari system, it is
  presided over by the Pitris (ancestors). Its shakti is the power to
  honor. All four padas reside in Simha with navamsha progression
  through Simha-Kanya-Tula-Vrishchika. As a rakshasa-gana, rajasic
  nakshatra with a royal temperament, it bestows authority, ancestral
  blessings, and the capacity for commanding leadership. Its star
  Regulus is one of the royal stars of the ancient world.


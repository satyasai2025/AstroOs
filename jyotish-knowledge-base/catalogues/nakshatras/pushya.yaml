notes: >
  Pushya is the eighth nakshatra, entirely within Karka (3°20' to
  16°40'). Ruled by Shani in the Vimshottari system, it is presided
  over by Brihaspati, the divine guru. Its shakti is the power to
  nourish. All four padas reside in Karka with navamsha progression
  through Kanya-Tula-Vrishchika-Dhanus. Considered one of the most
  auspicious nakshatras, as a deva-gana, sattvic nakshatra with a
  nourishing temperament, it bestows spiritual wisdom, protective
  nurturing, and the capacity to sustain others on the dharmic path.


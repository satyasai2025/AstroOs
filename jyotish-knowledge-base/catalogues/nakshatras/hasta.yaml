notes: >
  Hasta is the thirteenth nakshatra, entirely within Kanya (10° to
  23°20' Kanya). Ruled by Chandra in the Vimshottari system, it is
  presided over by Savitar, the solar creative deity. Its shakti is
  the power to place things in one's hands. All four padas reside in
  Kanya with navamsha progression through Simha-Kanya-Tula-Vrishchika.
  As a deva-gana, sattvic nakshatra with a skillful temperament, it
  bestows craftsmanship, artistic dexterity, and the capacity to
  manifest through the creative power of the hands. Its name literally
  means "hand," reflecting its deep connection to manual skill and
  creative expression.


id: dasha.ashtottari
name: Ashtottari Dasha
aliases: ["108-Year Dasha"]
category: dasha
status: active
confidence: high
version: 1.0
last_verified: 2026-07-15

type: nakshatra-dasha
total_years: 108

sequence:
  - graha: graha.surya
    years: 6
  - graha: graha.chandra
    years: 15
  - graha: graha.mangala
    years: 8
  - graha: graha.rahu
    years: 13
  - graha: graha.guru
    years: 10
  - graha: graha.shani

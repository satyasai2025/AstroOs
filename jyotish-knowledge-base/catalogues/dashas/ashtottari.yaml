total_verification: |
  6 + 15 + 8 + 13 + 10 + 7 + 17 + 7 + 25 = 108 years. Verified.

calculation_method: |
  Applicable when the birth occurs during Krishna Paksha (dark fortnight
  of the Moon) — i.e., from the day after Amavasya to the day before Purnima.

  The starting nakshatra is determined by the Moon's position at birth.
  The starting point is the nakshatra owned by the graha that rules the
  nakshatra occupied by the Moon. The first period begins from the lord
  of the Moon's nakshatra and proceeds in the fixed sequence above.

  The balance is calculated proportionally to the remaining padas of the
  Moon's nakshatra, similar to Vimshottari methodology.

antardasha: true
pratyantardasha: false
sub_period_calculation: |
  Antardasha within each mahadasha follows the same proportional method
  as Vimshottari:

    antardasha_years = (mahadasha_years * graha_years) / 108

  The antardasha sequence starts from the mahadasha lord and proceeds
  in the fixed Ashtottari order. Pratyantardasha and lower levels are
  generally not described in standard texts for this system.

sources:
  - ref: source.BPHS
    claim: "Brihat Parashara Hora Shastra, Chapter 9 — Ashtottari Dasha is a 108-year cycle dasha system applicable when birth occurs during Krishna Paksha (dark half of the Moon)."
    confidence: high

notes: |
  Ashtottari Dasha is a conditional dasha system — it is only used when
  the specific Paksha condition (Krishna Paksha) is met at birth. The
  total cycle is 108 years, which is 12 years less than Vimshottari.
  This system is less commonly used in modern practice compared to
  Vimshottari but is described in classical texts as an important
  supplementary system.

  The sequence is fixed and different from Vimshottari. The starting
  point depends on the nakshatra lord of the Moon's position at birth,
  not the Moon's nakshatra position directly as in Vimshottari.


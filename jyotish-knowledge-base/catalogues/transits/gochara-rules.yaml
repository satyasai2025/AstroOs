notes: >
  Transit rules are evaluated from both Lagna and Moon Lagna. The Moon-based
  transit is considered more immediately felt day-to-day, while Lagna-based
  transit has longer-term significance. Ashtakavarga points modulate the
  strength of transit effects. Gochara is one of three timing techniques
  (alongside Dasha and Antardasha) in BPHS.


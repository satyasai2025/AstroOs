# ── KETU GOCHARA ────────────────────────────────────────────────────────────

id: transit.ketu.gochara.h1
name: "Ketu Gochara — 1st House"
aliases: ["Ketu Transit 1st House", "Ketu in 1st from Lagna"]
category: transit
status: active
confidence: high
version: 1.0
last_verified: 2026-07-15

rule_type: gochara
statement: >
  When Ketu transits the 1st house from the natal Ascendant, the native
  experiences detachment from self, spiritual seeking, and confusion about
  personal identity. There is a tendency toward isolation, meditation, and
  letting go of material attachments. Physical health may be affected.
  BPHS Ch.42.

conditions:
  - entity: entity.graha.ketu
    role: subject
    position: "1st house from Lagna"

effects:
  - description: "Detachment from self and material world"
    intensity: strong
  - description: "Spiritual seeking and introspection"
    intensity: moderate
  - description: "Potential health issues or physical disorientation"
    intensity: moderate

timing:
  onset: "When Ketu enters the 1st house from Lagna"
  duration: "18 months"

sources:
  - ref: source.BPHS
    claim: >
      "When Ketu occupies the first house from the Lagna, the person will be
      detached from worldly pleasures and will seek spiritual liberation."
    confidence: high

notes: >
  Ketu's transit mirrors Rahu's but in the opposite direction — where Rahu
  creates desire and confusion, Ketu creates detachment and clarity (or loss).

history:
  - version: 1.0
    date: 2026-07-15
    change: "Initial catalogue entry"
    author: "Chief Jyotish Knowledge Architect"


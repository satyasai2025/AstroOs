# ── RAHU GOCHARA ────────────────────────────────────────────────────────────

id: transit.rahu.gochara.h1
name: "Rahu Gochara — 1st House"
aliases: ["Rahu Transit 1st House", "Rahu in 1st from Lagna"]
category: transit
status: active
confidence: high
version: 1.0
last_verified: 2026-07-15

rule_type: gochara
statement: >
  When Rahu transits the 1st house from the natal Ascendant, the native
  experiences confusion regarding identity, unconventional behavior, and sudden
  changes in self-expression. There may be a strong desire for recognition and
  material achievement. Foreign connections or unusual circumstances surround the
  self. BPHS Ch.42.

conditions:
  - entity: entity.graha.rahu
    role: subject
    position: "1st house from Lagna"

effects:
  - description: "Confusion about identity and self-image"
    intensity: strong
  - description: "Unconventional behavior and desire for recognition"
    intensity: moderate
  - description: "Sudden changes in personal circumstances"
    intensity: moderate

timing:
  onset: "When Rahu enters the 1st house from Lagna"
  duration: "18 months"

sources:
  - ref: source.BPHS
    claim: >
      "When Rahu occupies the first house from the Lagna, the person will be
      confused in mind, will have an unusual appearance, and may face unexpected
      changes in life."
    confidence: high

notes: >
  Rahu's transit is always marked by illusion (Maya), suddenness, and
  foreign or unconventional influences. Effects depend heavily on the
  sign Rahu transits and any conjunctions with natal grahas.

history:
  - version: 1.0
    date: 2026-07-15
    change: "Initial catalogue entry"
    author: "Chief Jyotish Knowledge Architect"


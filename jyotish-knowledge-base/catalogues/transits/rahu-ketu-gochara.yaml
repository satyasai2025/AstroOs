# ── ECLIPSE EFFECTS ─────────────────────────────────────────────────────────

id: transit.eclipse.effects
name: "Rahu-Ketu Eclipse Transit Effects"
aliases: ["Eclipse Effects", "Grahan Transit", "Rahu-Ketu Eclipse Period"]
category: transit
status: active
confidence: high
version: 1.0
last_verified: 2026-07-15

rule_type: gochara
statement: >
  When Rahu or Ketu transits near the Sun or Moon (within a close orb), the
  native experiences eclipse effects (Grahan Dosha). Rahu-Ketu near the Sun
  causes confusion in authority, father, and self-expression. Near the Moon,
  it causes emotional instability, mental health concerns, and domestic
  disturbances. Eclipse periods amplify all Rahu-Ketu transit effects.
  BPHS Ch.42.

conditions:
  - entity: entity.graha.rahu
    role: subject
    position: "conjunct or within close orb of Sun or Moon"
  - entity: entity.graha.ketu
    role: subject
    position: "conjunct or within close orb of Sun or Moon"

effects:
  - description: "Amplified confusion, illusion, and sudden events"
    intensity: strong
  - description: "Emotional instability when near Moon"
    intensity: strong
  - description: "Authority and self-expression issues when near Sun"
    intensity: strong

timing:
  onset: "When Rahu or Ketu transits within 5-7 degrees of natal Sun or Moon"
  duration: "Varies by proximity; strongest within conjunction"

sources:
  - ref: source.BPHS
    claim: >
      "When Rahu or Ketu comes close to the Sun or Moon during transit, it
      produces Grahan (eclipse) effects causing disturbance to the significations
      of the afflicted luminary."
    confidence: high

notes: >
  Eclipse effects are among the most potent Rahu-Ketu transit phenomena.
  The native should observe specific remedies during Grahan periods. Solar
  eclipses (Rahu near Sun) affect health and authority; lunar eclipses
  (Ketu near Moon) affect mental peace and domestic life.

history:
  - version: 1.0
    date: 2026-07-15
    change: "Initial catalogue entry"
    author: "Chief Jyotish Knowledge Architect"

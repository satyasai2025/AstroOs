# ============================================================================
# ASTRO OS — Guru (Jupiter) Gochara — Foundational Catalogue
# ============================================================================
# Source: BPHS Chapter 42 — Gochara Phaladhyaya
# Scope: Jupiter's transit effects through 12 houses from natal Lagna,
#         including key house significations for fortune, expansion, and wisdom.
# Orbital period: ~12 months per rashi (1 year)
# Note:  Foundational rules only. No predictive interpretations beyond BPHS.
# ============================================================================

# ── Guru Transit from Lagna (each house) ──────────────────────────────────

id: transit.guru.gochara.h1
name: "Guru Gochara — 1st House"
aliases: ["Jupiter Transit 1st House", "Guru in 1st from Lagna"]
category: transit
status: active
confidence: high
version: 1.0
last_verified: 2026-07-15

rule_type: gochara
statement: >
  When Jupiter transits the 1st house (Lagna) from the natal Ascendant, the native
  experiences enhanced self-confidence, optimism, and personal growth. There is a
  general upliftment of health, status, and fortune. The native radiates wisdom and
  may embark on new educational or spiritual ventures. BPHS Ch.42.

conditions:
  - entity: entity.graha.guru
    role: subject
    position: "1st house from Lagna"

effects:
  - description: "Increased self-confidence, optimism, and personal magnetism"
    intensity: strong
  - description: "Good health, vitality, and overall well-being"
    intensity: moderate
  - description: "New beginnings in education, philosophy, or spiritual matters"
    intensity: moderate

timing:
  onset: "When Jupiter enters the 1st house from Lagna"
  duration: "1 year (approximately)"

sources:
  - ref: source.BPHS
    claim: >
      "When Guru occupies the first house from the Lagna, the person will be
      happy, wealthy, and of good character, and will be respected by others."
    confidence: high

notes: >
  Jupiter in the 1st house is broadly benevolent — it blesses the native with
  wisdom and expansion of self. Effects are amplified when Jupiter is in exaltation
  (Cancer) or its own sign (Sagittarius, Pisces).

history:
  - version: 1.0
    date: 2026-07-15
    change: "Initial catalogue entry"
    author: "Chief Jyotish Knowledge Architect"


# ── MANGALIK TRANSIT SUMMARY ───────────────────────────────────────────────

id: transit.mangalik.positions
name: "Mangalik Transit Positions Summary"
aliases: ["Mangalik Transit Positions", "Mars Mangalik Houses"]
category: transit
status: active
confidence: high
version: 1.0
last_verified: 2026-07-15

rule_type: gochara
statement: >
  The Mangalik transit positions are the 1st, 4th, 7th, 8th, and 12th houses
  from the Lagna. When Mars transits these houses, its malefic energy is
  amplified, causing conflicts, accidents, health issues, and domestic
  disturbances. These positions are considered challenging and require caution
  and remedial measures. BPHS Ch.42.

conditions:
  - entity: entity.graha.mangala
    role: subject
    position: "1st, 4th, 7th, 8th, or 12th house from Lagna"

effects:
  - description: "Amplified malefic effects across personal, domestic, and partnership domains"
    intensity: strong
  - description: "Conflicts, accidents, health issues, and domestic disturbances"
    intensity: strong

timing:
  onset: "When Mars enters any of the 5 Mangalik houses from Lagna"
  duration: "45 days per house (total ~225 days across all 5 positions)"

sources:
  - ref: source.BPHS
    claim: >
      "The Mangalik positions for transit are the first, fourth, seventh, eighth,
      and twelfth houses from the Ascendant. Mars in these houses produces
      challenging effects."
    confidence: high

notes: >
  The 5 Mangalik transit positions mirror the natal Mangalik Dosha positions.
  While natal Mangalik is permanent, transit Mangalik is temporary (45 days each).
  The effects are most severe when Mars is in its own sign or exaltation during
  these transits.


id: transit.mangala.gochara.h1
name: "Mangala Gochara — 1st House (Mangalik Transit)"
aliases: ["Mars Transit 1st House", "Mangala in 1st from Lagna", "Mangalik Transit"]
category: transit
status: active
confidence: high
version: 1.0
last_verified: 2026-07-15

rule_type: gochara
statement: >
  When Mars transits the 1st house (Lagna) from the natal Ascendant, the native
  experiences heightened energy, aggression, and physical vitality. This is a
  Mangalik transit position — the native may face conflicts, accidents, or
  heated arguments. Mars in the 1st intensifies self-expression and assertiveness.
  BPHS Ch.42.

conditions:
  - entity: entity.graha.mangala
    role: subject
    position: "1st house from Lagna"

effects:
  - description: "Heightened energy, aggression, and physical vitality"
    intensity: strong
  - description: "Increased likelihood of conflicts, arguments, or accidents"
    intensity: strong
  - description: "Strong assertiveness and self-assertion"
    intensity: moderate

timing:
  onset: "When Mars enters the 1st house from Lagna"
  duration: "45 days (approximately)"

sources:
  - ref: source.BPHS
    claim: >
      "When Mangala occupies the first house from the Lagna, the person will be
      energetic and courageous but may face conflicts and accidents."
    confidence: high

notes: >
  Mars through the 1st is a Mangalik transit position. While the natal
  Mangalik Dosha is permanent, the transit Mangalik effect is temporary
  (45 days) and amplifies aggressive tendencies.

history:
  - version: 1.0
    date: 2026-07-15
    change: "Initial catalogue entry"
    author: "Chief Jyotish Knowledge Architect"


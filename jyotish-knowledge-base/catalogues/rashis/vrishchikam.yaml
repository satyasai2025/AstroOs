notes: >
  Vrishchika is the eighth sign of the zodiac, governing depth,
  transformation, and occult mysteries. As a fixed water sign, it
  embodies intense emotional depth, secrecy, and a powerful
  regenerative capacity. Natives born under Vrishchika are said to be
  passionate, resourceful, and deeply perceptive. The sign corresponds
  to the reproductive organs (Guhya) in the Kalapurusha correspondence
  of the zodiac to the human body.


notes: >
  Meena is the twelfth and final sign of the zodiac, governing
  spirituality, dissolution, and transcendental wisdom. As a dual
  water sign, it embodies compassion, deep intuition, and a connection
  to the collective unconscious. Natives born under Meena are said to
  be empathetic, artistic, and spiritually inclined. The sign corresponds
  to the feet (Pada) in the Kalapurusha correspondence of the zodiac
  to the human body, completing the macrocosmic mapping.


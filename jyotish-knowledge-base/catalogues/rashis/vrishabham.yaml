notes: >
  Vrishabha is the second sign of the zodiac, ruling material stability
  and earthly pleasures. As a fixed earth sign, it embodies patience,
  persistence, and a deep connection to the physical world. Natives born
  under Vrishabha are said to be reliable, sensual, and deeply attached
  to comfort and security. The sign corresponds to the face (Mukha) in
  the Kalapurusha correspondence of the zodiac to the human body.


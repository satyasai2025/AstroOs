notes: >
  Makara is the tenth sign of the zodiac, governing career, discipline,
  and worldly achievement. As a cardinal earth sign, it embodies
  ambition, pragmatism, and a methodical climb toward success. Natives
  born under Makara are said to be disciplined, responsible, and
  driven by a strong sense of duty. The sign corresponds to the knees
  (Janu) in the Kalapurusha correspondence of the zodiac to the human
  body. Makara exalts Mangala and is ruled by Shani.


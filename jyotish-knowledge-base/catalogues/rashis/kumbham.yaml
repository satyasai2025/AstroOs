notes: >
  Kumbha is the eleventh sign of the zodiac, governing innovation,
  friendship, and collective vision. As a fixed air sign, it embodies
  originality, intellectual independence, and a humanitarian outlook.
  Natives born under Kumbha are said to be progressive, idealistic, and
  driven by a desire for social reform. The sign corresponds to the
  calves (Jangha) in the Kalapurusha correspondence of the zodiac to
  the human body.


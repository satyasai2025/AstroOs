notes: >
  Dhanus is the ninth sign of the zodiac, governing wisdom, philosophy,
  and higher aspirations. As a dual fire sign, it embodies optimism,
  adventure, and a quest for meaning. Natives born under Dhanus are
  said to be philosophical, generous, and driven by a sense of higher
  purpose. The sign corresponds to the thighs (Uru) in the Kalapurusha
  correspondence of the zodiac to the human body. Dhanus is the only
  sign ruled by Guru (Jupiter).


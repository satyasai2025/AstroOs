notes: >
  The 12th house (Vyaya Bhava) is the last house in the
  chart, representing the conclusion of the material cycle
  and the transition toward spiritual liberation. As a
  Dusthana (difficult house), it indicates losses and
  expenses, but also holds the highest spiritual potential.
  Ketu as natural karaka reinforces the theme of dissolution
  and moksha. The 12th house also governs foreign lands,
  sleep, and the subconscious mind. Its interpretation
  depends heavily on the condition of its lord and
  occupying grahas.


notes: >
  The 2nd house (Dhana Bhava) is primarily concerned with wealth,
  family, and speech. As a marakasthana, it has the capacity to
  indicate death, particularly when activated by its lord or a
  maraka graha in dasha. Guru as natural karaka reinforces the
  association with prosperity. The Upapada Lagna (UL) calculation
  uses the 2nd house lord, linking this bhava to marriage and
  family lineage.


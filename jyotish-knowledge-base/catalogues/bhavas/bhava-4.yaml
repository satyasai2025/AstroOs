notes: >
  The 4th house (Sukha Bhava) governs domestic happiness, mother,
  emotional security, and immovable property. As a Kendra (angular
  house), it is highly significant. Chandra as natural karaka
  links this house to emotions, nurturing, and the mind. The
  4th house also indicates the quality of one's education and
  the comfort derived from home and family life.


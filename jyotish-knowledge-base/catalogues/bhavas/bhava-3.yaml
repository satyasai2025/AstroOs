notes: >
  The 3rd house (Vikrama Bhava) represents courage, effort, and
  communication. It is the second upachaya (growth) house, indicating
  that matters of the 3rd house improve over time. Mangala as natural
  karaka reinforces the martial, energetic quality of this bhava.
  The 3rd house also governs hobbies, writing, and one's inherent
  willpower.


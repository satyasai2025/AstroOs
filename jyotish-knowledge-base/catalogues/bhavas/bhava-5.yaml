notes: >
  The 5th house (Putra Bhava) is a Trikona (trinal) house and is
  considered highly auspicious. It governs children, creativity,
  intelligence, and spiritual practices involving mantra. Guru
  as natural karaka reinforces the wisdom and expansive qualities
  of this bhava. The 5th house also indicates purva punya (merit
  from past lives), speculative ability, and romantic inclinations.


notes: >
  The 7th house (Yuvati Bhava) is a Kendra (angular house) and a
  marakasthana. It governs marriage, partnerships, and all forms
  of one-to-one relationships. As the opposite of Lagna, it
  represents the 'other' in relation to the self. Shukra as
  natural karaka reinforces the romantic and partnership-oriented
  nature of this bhava. The 7th lord (Kalatrapati) is a key
  indicator of marital quality and timing.


notes: >
  The 6th house (Ari Bhava) is a Dusthana (difficult house) and an
  upachaya (growth) house. Matters of the 6th house improve over
  time. Malefics are considered less harmful in the 6th house, and
  a strong 6th house can give victory over enemies and success in
  service. Benefics placed here can create dhana sankata —
  obstruction of wealth. The 6th house also governs daily work,
  health regimens, and maternal uncles.


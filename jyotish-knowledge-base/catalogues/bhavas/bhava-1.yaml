notes: >
  The 1st house (Tanu Bhava) is the most important house in
  the chart, representing the self, physical body, and
  overall personality. It is both a Kendra (angular) and a
  Trikona (trinal) house, making it uniquely powerful. The
  Lagna (Ascendant) is the rising sign at the time of birth
  and serves as the reference point for the entire chart.
  Surya as natural karaka reinforces the association with
  self-identity and vitality.


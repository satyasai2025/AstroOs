notes: |
  This catalogue maps life events to their governing houses and natural karakas.
  It serves as a cross-reference tool for chart interpretation.

  Key principles:
  1. Each life event has primary (strongest) and secondary (supporting) houses
  2. The natural karaka graha provides additional signification
  3. Multiple houses contribute to any single life event
  4. House placement of karaka grahas modifies the event outcome
  5. Transit and dasha periods activate specific life events

  Usage in chart reading:
  1. Identify the life event in question
  2. Check primary and secondary houses for supporting/afflicting grahas
  3. Examine the natural karaka graha's placement, conjunctions, and aspects
  4. Consider dasha-bhukti periods for timing


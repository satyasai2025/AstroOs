notes: |
  This index provides a master cross-reference for all karakatva catalogue records.
  It enables:
  1. Quick lookup of graha-bhava-karakatva relationships
  2. Reverse lookups: given a life event, find governing houses and karakas
  3. Nakshatra-graha ruler mappings for transit and dasha analysis
  4. Coverage verification of all classical elements

  Usage workflow:
  1. Consult graha-karakatvas.yaml for natural graha significations
  2. Consult bhava-karakatvas.yaml for natural bhava significations
  3. Consult nakshatra-karakatvas.yaml for nakshatra-specific themes
  4. Consult house-significations.yaml for life event mapping
  5. Use cross_reference_matrix for quick entity-to-entity lookups

  Dependencies:
  - Graha catalogue (graha/) for entity definitions
  - Bhava catalogue (bhava/) for house definitions
  - Nakshatra catalogue (nakshatra/) for star definitions
  - Source catalogue for citation references

history:
  - version: 1.1
    date: 2026-07-16
    change: "Corrected graha_to_nakshatra_rulers cross-reference matrix: Chandra was listed with Pushya (Shani's nakshatra) instead of Hasta; Guru was listed with Moola (Ketu's) instead of Purva Bhadrapada; Rahu erroneously had a fourth nakshatra (Purva Bhadrapada, which belongs to Guru). Also corrected total_records (53 -> 85) and life_events_mapped (35 -> 37) to match the actual sub-counts, and standardized nakshatra ID spelling/format to match catalogues/nakshatras/_index.yaml."
    author: "Chief Jyotish Knowledge Architect"
  - version: 1.0
    date: 2026-07-15
    change: "Initial catalogue index with cross-reference matrix"
    author: "Chief Jyotish Knowledge Architect"

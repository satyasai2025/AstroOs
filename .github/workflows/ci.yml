name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  typecheck-and-crawl:
    name: Typecheck & Playwright Health Crawler
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run Web Typecheck
        run: pnpm --filter @workspace/web run typecheck

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps
        working-directory: apps/web

      - name: Build Web Application
        run: pnpm --filter @workspace/web run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Start Next.js Server & Run Health Crawler
        run: |
          pnpm --filter @workspace/web run start &
          npx wait-on http://localhost:3000 --timeout 60000
          pnpm --filter @workspace/web run crawl
        env:
          BASE_URL: http://localhost:3000

      - name: Upload Crawler Screenshots & Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-crawler-reports
          path: apps/web/crawler-reports/
          if-no-files-found: ignore

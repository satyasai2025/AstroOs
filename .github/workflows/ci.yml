name: AstroOS CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Verify TypeScript Types
        run: npm run typecheck --workspace=apps/web

      - name: Build Web Application
        run: npm run build --workspace=apps/web

      - name: Start Production Web Server
        run: npm run start --workspace=apps/web &

      - name: Wait for Web Server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Playwright Site Health Crawler
        run: node apps/web/scripts/crawl-site.js

      - name: Upload Crawler Reports & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-reports
          path: apps/web/crawler-reports/
          retention-days: 14

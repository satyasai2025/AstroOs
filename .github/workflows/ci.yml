name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql+asyncpg://astroos:astroos_ci_password@localhost:5432/astroos
  TEST_DATABASE_URL: postgresql+asyncpg://astroos:astroos_ci_password@localhost:5432/astroos
  REDIS_URL: redis://localhost:6379/0
  ENVIRONMENT: test
  DEBUG: "false"
  EPHEMERIS_PATH: data/ephemeris
  JWT_PRIVATE_KEY_PATH: apps/api/security/keys/private.pem
  JWT_PUBLIC_KEY_PATH: apps/api/security/keys/public.pem

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: astroos
          POSTGRES_PASSWORD: astroos_ci_password
          POSTGRES_DB: astroos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astroos -d astroos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install backend dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Generate RSA keys for JWT
        run: python apps/api/security/generate_keys.py

      - name: Run Alembic migrations
        run: alembic -c database/alembic.ini upgrade head

      - name: Unit tests (excludes tests requiring live services)
        run: pytest -c apps/api/pytest.ini -m "not integration"

      - name: Integration tests (real Postgres, Redis, Swiss Ephemeris)
        run: pytest -c apps/api/pytest.ini -m integration

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/web
        run: pnpm run typecheck

      - name: Lint
        working-directory: apps/web
        run: pnpm run lint

# AstroOS Kubernetes Deployment (M3)
# Place in deploy/k8s/

apiVersion: apps/v1
kind: Deployment
metadata:
  name: astroos-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: astroos-api
  template:
    metadata:
      labels:
        app: astroos-api
    spec:
      containers:
        - name: api
          image: astroos/api:v2.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: astroos-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: astroos-api
spec:
  selector:
    app: astroos-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
# =============================================================================
# DISCLAIMER: This file is OPTIONAL / FUTURE REFERENCE ONLY.
# AstroOS v2.1.0+ is a LOCAL-FIRST platform. The primary deployment target is
# native PostgreSQL + FastAPI + Next.js on a single machine — no Kubernetes
# required. This manifest is retained from earlier iterations for users who
# wish to experiment with K8s clustering; it is NOT part of the supported
# deployment path and may be out of date.
# =============================================================================
#
# AstroOS Kubernetes Deployment (M3)
# Place in deploy/k8s/

apiVersion: apps/v1
kind: Deployment
metadata:
  name: astroos-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: astroos-api
  template:
    metadata:
      labels:
        app: astroos-api
    spec:
      containers:
        - name: api
          image: astroos/api:v2.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: astroos-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: astroos-api
spec:
  selector:
    app: astroos-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
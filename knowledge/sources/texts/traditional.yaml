significance: "A deliberate pseudo-source marker used when a catalogue entry documents a widely-practiced technique or combination (e.g. Sarpadosha, Kaal Sarpadosha) that is well-established in living practice and oral teaching lineages but is not traceable to a single specific classical verse or named text. This is distinct from an unresearched or missing citation — it signals that the claim's authority rests on broad contemporary practitioner consensus rather than textual attribution."

notes: "Used sparingly. Any entry citing source.traditional should still specify, in its own notes, why the claim is considered reliable despite lacking a specific textual citation. Confidence is deliberately kept low at the source level to flag this distinction to future contributors."


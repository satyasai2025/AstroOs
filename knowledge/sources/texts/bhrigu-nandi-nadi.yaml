significance: >
  The Bhrigu Nandi Nadi is a foundational text of the Nadi tradition of
  Jyotish. It presents a unique approach to chart interpretation based
  on planetary positions and nakshatra-based predictions. The Nadi system
  is known for its detailed and specific predictions. The text is
  considered by its adherents to be of equal authority to BPHS.

notes: >
  The Nadi tradition uses its own unique dasha system and interpretive
  rules. The Bhrigu Nandi Nadi is one of several Nadi texts, others
  including those from Vaitheeswaran Koil (Tamil Nadu). The text is
  traditionally preserved on palm-leaf manuscripts. The authenticity
  and dating of the text are subjects of scholarly debate.
  Classification note: Nadi texts are treated as a primary source for
  the Nadi system but their authority for classical Parashari Jyotish
  is secondary.


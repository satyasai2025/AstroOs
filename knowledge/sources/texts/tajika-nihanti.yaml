significance: >
  The Tajika Nihanti is the foundational text for Tajika (annual
  horoscopy) Jyotish. It presents the system of annual charts
  (Varshaphal) used for predicting events in a given year, based
  on the solar return. The Tajika system introduces unique concepts
  such as Muntha, Ittalaqa, and the Tajika yogas.

notes: >
  Tajika is a specialized branch of Jyotish focused on annual
  predictions. It uses a separate set of rules from the birth
  chart analysis. The system is of Persian-Arabic origin but was
  integrated into Indian Jyotish. Tajika is classified as a
  separate system within the broader Jyotish tradition.


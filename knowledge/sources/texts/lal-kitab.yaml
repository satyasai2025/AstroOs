significance: >
  The Lal Kitab is a modern astrological text that presents a unique
  system combining Persian, Arabic, and Indian astrological traditions.
  It is known for its distinctive approach to house interpretation,
  remedies, and predictive techniques. The system differs significantly
  from classical Parashari Jyotish in its foundational principles.

notes: >
  The Lal Kitab system uses a fixed set of house significations that
  differ from classical BPHS. It also prescribes specific remedies
  (upayas) for astrological afflictions. The system is widely followed
  in North India and Pakistan. Because it is a modern system, it is
  classified as a separate school rather than a variant of Parashari.


significance: "Brihat Parashara Hora Shastra is regarded as the most authoritative and foundational text of the Parashari school of Jyotish, the mainstream tradition underlying the majority of this knowledge base. Traditionally attributed to the sage Parashara, it systematically covers grahas, rashis, bhavas, yogas, dashas, aspects, divisional charts, and remedial measures across its 97 (some editions 100) chapters. Nearly every catalogue record in this knowledge base cites BPHS as its primary or supporting source."

notes: "The extant text is widely believed by scholars to be a later redaction/compilation (commonly dated to roughly the 7th-8th century CE) of teachings attributed to the ancient sage Parashara, whose own dating is traditionally placed much earlier and is not treated as historically fixed in the way the redaction is. Several editions exist with differing chapter counts (typically 97 or 100 depending on the recension); this record follows the commonly cited 97-chapter structure used by the Santhanam and Raman editions. This is the single most-cited source across this entire knowledge base."


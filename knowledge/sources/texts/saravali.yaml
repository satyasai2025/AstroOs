significance: "Saravali is one of the most comprehensive classical Jyotish texts, covering 101 chapters on virtually every aspect of horoscopy. It is particularly valued for its systematic treatment of yogas, its detailed varga interpretations, and its extensive Dasha timing techniques. The text's encyclopedic scope and practical orientation made it an essential reference for practitioners across India."

notes: "The date of Kalyanavarma is highly debated, with estimates ranging from 300 CE to 1150 CE. The earlier dating (300 CE) was proposed by B.V. Raman based on astronomical references, while later scholarship places the text in the 9th-12th century period. The text survives in multiple manuscript recensions with significant variations in chapter ordering and content between South Indian and North Indian traditions. The Telugu commentary by Ethiraja is particularly important for textual reconstruction."


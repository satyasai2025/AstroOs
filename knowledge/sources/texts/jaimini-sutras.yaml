significance: >
  The Jaimini Sutras are the foundational text of the Jaimini system
  of Jyotish, which differs significantly from the Parashari system
  in its use of the Chara Karaka system (astrological significators
  based on planetary degrees), Rashi Drishti (sign aspects), Chara
  Dasha (a unique rashi-based dasha system), and the Karakamsha
  (a chart derived from the Atmakaraka in D-9). While BPHS is the
  root text for mainstream Jyotish, the Jaimini Sutras provide an
  alternative framework that many practitioners consider equally
  authoritative.

notes: >
  The interpretation of the Jaimini Sutras is less standardized than
  BPHS. Different commentators (Sharma, Sanjay Rath, etc.) differ
  on some key points. The sutra format (terse aphorisms) allows for
  multiple valid interpretations. The text contains only 4 chapters
  with approximately 1000 sutras (depending on recension). The
  Jaimini system is often used in conjunction with Parashari, not
  as a replacement.


    section: "ज्योतिष की परिभाषा (Definition of Jyotisha)"
    title: "Jyotisha defined as the science of karma-fruition timing"
    claim: >
      The page defines Jyotisha with the phrase "karma-phala-vipaka-kala-vidhanam"
      (the rule governing the timing of ripening of karmic fruits), framing astrology
      as the study of when karmic results (drishta and adrishta phala) manifest,
      with Prarabdha as the currently-active portion of accumulated karma.
    item_type: FACT_DEFINITION
    referenced_classical_source: null
    related_concepts: ["karma", "prarabdha", "phalit-jyotisha"]
    technique_framework: "Parashari"
    verification_status: UNVERIFIED

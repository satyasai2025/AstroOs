# knowledge/sources/vedicastrology_wikidot/validation_requirements.yaml
#
# VALIDATION REQUIREMENTS (not benchmark results) for empirical/methodology claims
# extracted from VedicAstrology.Wikidot that were flagged requires_validation: true.
# These are pending work items for the EXISTING benchmark engine
# (apps/api/services/benchmark_engine.py, apps/api/domain/benchmark.py) — no new
# Benchmark Engine or taxonomy is created here. suggested_benchmark_category values
# below are derived from the dataclasses already present in domain/benchmark.py
# (PlanetBenchmark -> PLANET_POSITION, HouseBenchmark -> HOUSE_CUSP,
# VargaBenchmark -> VARGA_ACCURACY). No exact "strength methodology" category exists
# yet in benchmark.py, so those items use GENERAL_METHODOLOGY as an explicit fallback
# label pending a human decision on whether to extend the benchmark taxonomy.

requirements:
  - requirement_id: VR-WIKIDOT-STRENGTH-01
    claim: >
      Ishta-Kashta ('main strength') uses a base-2 logarithmic scale
      (60-45-30-22-15-8-4-2-0) and should take precedence over Shadbala, which
      should only be used as a tiebreaker.
    source_url: "http://vedicastrology.wikidot.com/main-strength-versus-shadbala"
    suggested_benchmark_category: GENERAL_METHODOLOGY
    status: NOT_YET_BENCHMARKED
    notes: >
      No existing PlanetBenchmark/HouseBenchmark/VargaBenchmark category in
      apps/api/domain/benchmark.py directly covers dignity-scoring precedence rules;
      flagged as GENERAL_METHODOLOGY pending human decision on taxonomy extension.

  - requirement_id: VR-WIKIDOT-DAC-01
    claim: >
      DAC (Dashaa Aarambha Chakra) requires high birth-time-accuracy and is
      "impractical now"; SC (Sudarshana Chakra) + VPC (Varsha Pravesha Chakra) +
      Vimshottari is claimed as the practical substitute for dasha-period predictions.
    source_url: "http://vedicastrology.wikidot.com/ashtaka-varga"
    suggested_benchmark_category: GENERAL_METHODOLOGY
    status: NOT_YET_BENCHMARKED
    notes: >
      Requires a ground-truth event dataset with birth-time precision metadata to
      test DAC vs SC+VPC+Vimshottari predictive accuracy; no existing benchmark
      category models "dasha-period-specific predictive accuracy," so flagged
      GENERAL_METHODOLOGY.

  - requirement_id: VR-WIKIDOT-D9DEITY-01
    claim: >
      Preponderance of the Rakshasa D-9 (Navamsha) deity among planets is claimed
      correlated with societal outcomes (example given: a rise in rape cases in
      first half of 2014) and with individual libido-related danger during the
      Mahadasha of a planet with a Rakshasa D-9 deity.
    source_url: "http://vedicastrology.wikidot.com/divisional-charts"
    suggested_benchmark_category: VARGA_ACCURACY
    status: NOT_YET_BENCHMARKED
    notes: >
      Closest fit is VargaBenchmark (D-9/Navamsha is a divisional chart), but the
      claim is about deity-symbolism correlated with outcomes rather than
      chart-computation accuracy — flagged for human review on whether this even
      belongs in the benchmark taxonomy versus mundane/Medini-specific tooling.

items:
  - source: "VedicAstrology.Wikidot"
    source_url: "http://vedicastrology.wikidot.com/raaj-jyotisha"
    page_title: "Raaj Jyotisha"
    section: "राजज्योतिष के विभाग (Divisions of Raj-Jyotisha)"
    title: "Medini Jyotisha operates at six nested chakra levels"
    claim: >
      Medini Jyotisha (mundane astrology), described as the principal branch of
      Raj-Jyotisha, studies natural and man-made events of the earth across six
      nested levels: Prithvi-chakra (also called Padma-chakra, whole earth),
      Desha-chakra (country), Pradesha-chakra (janapada/province),
      Mandala-chakra (district), Grama/Nagara-chakra (village or city), and
      Grihya/Kshetra-chakra (household or field).
    item_type: FACT_DEFINITION
    referenced_classical_source: null
    related_concepts: ["Medini Jyotisha", "Mundane astrology", "Desha-chakra", "Prithvi-chakra"]
    technique_framework: Parashari
    verification_status: UNVERIFIED
    lifecycle_state: DOCUMENTED

  - source: "VedicAstrology.Wikidot"
    source_url: "http://vedicastrology.wikidot.com/raaj-jyotisha"
    page_title: "Raaj Jyotisha"
    section: "राजज्योतिष के विभाग (Divisions of Raj-Jyotisha)"
    title: "Sthapana-chakra: a foundation-moment chart, distinct from the country's own chart"
    claim: >
      The second branch of Raj-Jyotisha is Sthapana-chakra — a chart cast for the
      founding moment of a village, city or state, or for a ruler's/leader's
      assumption of office. The page gives independent India's 15 August 1947
      chart as an example and asserts it is DISTINCT from India's Desha-chakra:
      the 1947 chart is said to show the fortunes of the group to whom power was
      transferred, not of the country as a whole.
    item_type: METHODOLOGY_CLAIM
    referenced_classical_source: null
    related_concepts: ["Sthapana-chakra", "Desha-chakra", "foundation chart"]
    technique_framework: Parashari
    verification_status: UNVERIFIED
    lifecycle_state: DOCUMENTED

  - source: "VedicAstrology.Wikidot"
    source_url: "http://vedicastrology.wikidot.com/raaj-jyotisha"
    page_title: "Raaj Jyotisha"
    section: "दीर्घकालिक फलादेश का साधन - दिव्यवर्ष (Divya-varsha)"
    title: "Divya-varsha = 360 solar years, used as the unit for long-period mundane charts"
    claim: >
      Per the siddhanta texts and Puranas, one Divya-varsha ("divine year", a
      year of the devas) equals 360 solar years. The page claims that just as
      mundane charts are cast at Meshadi (nirayana Sun entering Aries) for the
      solar year, charts are likewise cast for the entry of a Divya-varsha and
      Divya-masa — and that this tradition has been forgotten. It cites the Gita's
      description of Uttarayana as the devas' day and Dakshinayana as their night
      as being the day and night of this same Divya-varsha.
    item_type: METHODOLOGY_CLAIM
    referenced_classical_source: "Siddhanta texts and Puranas (unnamed); Bhagavad Gita (Uttarayana/Dakshinayana)"
    related_concepts: ["Divya-varsha", "Meshadi", "Uttarayana", "Dakshinayana"]
    technique_framework: Parashari
    verification_status: UNVERIFIED
    lifecycle_state: DOCUMENTED

  - source: "VedicAstrology.Wikidot"
    source_url: "http://vedicastrology.wikidot.com/raaj-jyotisha"
    page_title: "Raaj Jyotisha"
    section: "राजज्योतिष के विभाग (Divisions of Raj-Jyotisha)"
    title: "Natal and national charts use identical mathematics and judgement method"
    claim: >
      The page asserts that individual horoscopes and national charts are built
      from the same ganita (mathematics) and the same phalita (judgement) method,
      both based on Parashara's Hora Shastra, while differing in several important
      respects that the page does not fully enumerate in this section.
    item_type: METHODOLOGY_CLAIM
    referenced_classical_source: "BPHS (Parashara's Hora Shastra), unspecified"
    related_concepts: ["Desha-chakra", "natal chart", "ganita", "phalita"]
    technique_framework: Parashari
    verification_status: UNVERIFIED
    lifecycle_state: DOCUMENTED

  - source: "VedicAstrology.Wikidot"
    source_url: "http://vedicastrology.wikidot.com/raaj-jyotisha"
    page_title: "Raaj Jyotisha"
    section: "मेदिनीचक्र बनाने की विधि (Method of constructing Medini-chakra)"
    title: "Mundane ingress charts have exact time, unlike natal charts"
    claim: >
      The page argues a methodological advantage for mundane work: an individual
      chart always carries some birth-time uncertainty, whereas national and
      international charts are cast for a year/month INGRESS moment, whose time is
      exactly known. It concludes that astrological rules can therefore be studied
      in mundane charts without the doubt introduced by birth-time error.
    item_type: METHODOLOGY_CLAIM
    referenced_classical_source: null
    related_concepts: ["ingress chart", "birth-time rectification", "Medini-chakra"]
    technique_framework: Parashari
    verification_status: UNVERIFIED
    lifecycle_state: DOCUMENTED
    cross_reference_note: >
      Directly relevant to VR-WIKIDOT-DAC-01. The same site elsewhere argues DAC
      is impractical BECAUSE of extreme birth-time sensitivity; here it argues
      mundane charts escape that problem entirely. The two claims are consistent
      with each other and, taken together, suggest the source treats birth-time
      precision as the central limiting factor on predictive method. Not verified.

  - source: "VedicAstrology.Wikidot"
    source_url: "http://vedicastrology.wikidot.com/raaj-jyotisha"
    page_title: "Raaj Jyotisha"
    section: "राजज्योतिष के विभाग (Divisions of Raj-Jyotisha)"
    title: "Claim that two-thirds of Parashara's Hora Shastra is lost and surviving editions are corrupted"
    claim: >
      The page claims two-thirds of Parashara's Hora Shastra is lost; that the
      surviving third was published by Devachandra Jha and Ganeshdatta Pathak; and
      that Sitaram Jha published a corrupted edition after making arbitrary changes
      to the manuscript. It further alleges this corrupted edition is gaining
      universal acceptance because South Indian astrologers dominate the internet,
      and that the corruption specifically involved removing Bhava-Chalita — which
      it says has little effect on charts in South India but causes increasingly
      wrong charts at latitudes far from the equator.
    item_type: OPINION_ASSERTION
    referenced_classical_source: "BPHS manuscript transmission (Devachandra Jha, Ganeshdatta Pathak, Sitaram Jha editions)"
    related_concepts: ["BPHS recension", "Bhava-Chalita", "manuscript transmission"]
    technique_framework: Parashari
    verification_status: UNVERIFIED
    lifecycle_state: DOCUMENTED
    handling_note: >
      Classified OPINION_ASSERTION, not FACT_DEFINITION, and recorded verbatim-in-
      substance without endorsement. It is an unverified allegation of deliberate
      textual corruption against a NAMED individual, and it carries a regional
      attribution about South Indian astrologers that this project takes no
      position on. It is retained only because it is the source's own stated
      rationale for CONFLICT-WIKIDOT-001 (Bhava-Chalita vs whole-sign) — knowing
      WHY the source holds that position is useful provenance. Nothing here
      resolves that conflict, which remains ACTIVE_DISPUTE.
      Related: primary_text_verification.yaml notes an independent critique of the
      Santhanam BPHS recension by this same author, so recension disputes around
      BPHS are a real scholarly area — but this specific allegation is unverified.

  - source: "VedicAstrology.Wikidot"
    source_url: "http://vedicastrology.wikidot.com/raaj-jyotisha"
    page_title: "Raaj Jyotisha"
    section: "मेदिनीचक्र बनाने की विधि (Method of constructing Medini-chakra)"
    title: "Varahamihira's Brihat Samhita is cited as precedent for map-based mundane chakras"
    claim: >
      The page claims that well-known Kaliyuga astrologers including Varahamihira
      discussed map-based mundane chakras in detail in works such as Brihat
      Samhita, and complains that no modernist astrologer active on the internet
      has acknowledged the need to study Medini chakras on a map.
    item_type: UNVERIFIED_CLAIM
    referenced_classical_source: "Brihat Samhita (Varahamihira) — no chapter or verse given"
    related_concepts: ["Brihat Samhita", "Medini-chakra", "map-based astrology"]
    technique_framework: Parashari
    verification_status: UNVERIFIED
    lifecycle_state: DOCUMENTED
    requires_validation: true
    suggested_validation_approach: >
      Checkable against a primary text: Brihat Samhita is available in
      transcription. Confirming whether it describes map-projected mundane chakras
      would settle this claim. Not attempted in this pass — no chapter/verse was
      given to target, and the full-text search effort is comparable to the BPHS
      Ch. 28 pass recorded in primary_text_verification.yaml.


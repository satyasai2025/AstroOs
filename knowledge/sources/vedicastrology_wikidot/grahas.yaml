    section: "Definitions and Properties of Graha in Jyotisha and Physics"
    title: "Graha is theologically defined, not astronomically defined"
    claim: >
      The page argues that the Jyotisha concept of "Graha" is fundamentally distinct
      from the physics concept of "planet" — ancient texts define Grahas as
      manifestations providing karmic fruits to beings, not physical bodies orbiting
      the Sun, and warns against conflating the two definitions merely because names coincide.
    item_type: OPINION_ASSERTION

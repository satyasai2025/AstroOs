    title: "D1 (Rashi chart) is itself the first divisional, and Bhava-Chalita is the proper D1"
    claim: >
      The page claims D1 is not simply the Rashi Chart but the Bhava-Chalita (BC)
      chart, and that "lots of people confuse D1 with Rasi Chart" — asserting Rasi
      Chart is only the base mathematical construct for deriving all divisionals,
      aspects, and relations, while all Bhava-phala (house-based predictive results)
      must be deduced from the Bhava-Chalita chart specifically.

  - source: "VedicAstrology.Wikidot"
    source_url: "http://vedicastrology.wikidot.com/divisional-charts"
    page_title: "Divisional Charts"
    section: "Divisionals versus D-1"
    title: "Vimshopaka Strength governs which divisional's Vimshottari planet dominates during overlap"
    claim: >
      IF the current Vimshottari-dasha planet in a divisional chart (e.g. D24, for
      education) is stronger by Vimshopaka Strength than the current Vimshottari
      planet in D1, THEN the D24 (or other divisional) result will override the D1
      result during that planet's dasha period, even if the two planets differ; the
      page states that practitioners unaware of this Vimshopaka-weighted overlap
      rule may wrongly suspect errors in birth time or ayanamsha when divisional
      predictions appear to contradict D1.
    item_type: RULE
    condition_summary: >
      Comparing Vimshottari-dasha-lord strength (via Vimshopaka Strength, per BPHS)
      between D1 and a relevant divisional chart (e.g. D24 for education) during an
      overlapping dasha period.
    conclusion_summary: >
      The divisional chart's stronger dasha-lord result is claimed to dominate/override
      the D1 result for domain-specific predictions during that period.
    referenced_classical_source: "BPHS (Vimshopaka Strength)"
    related_concepts: ["vimshopaka-strength", "vimshottari", "d24", "divisional-override"]
    technique_framework: "Parashari"
    verification_status: UNVERIFIED
    lifecycle_state: DOCUMENTED


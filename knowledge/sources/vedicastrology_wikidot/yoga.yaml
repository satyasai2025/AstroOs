  - source: "VedicAstrology.Wikidot"
    source_url: "http://vedicastrology.wikidot.com/vipareet-raja-yoga"
    page_title: "Vipareet Raja Yoga"
    section: "Vipareet Raja Yoga"
    title: "BV Raman's Harsha, Sarala, and Vimala Yogas are 6th/8th/12th lords in Trika houses, but do not alone form Rajayoga"
    claim: >
      The page cites B.V. Raman's compilation of ~300 yogas as defining Harsha Yoga
      (6th lord in a Trika house), Sarala Yoga (8th lord in a Trika house), and
      Vimala Yoga (12th lord in a Trika house) respectively, while explicitly stating
      that these three yogas alone do not constitute a full Rajayoga (royal/success
      combination) by themselves, and that fruits of a Vipareet Raja Yoga configuration
      manifest during the dashas of the yoga-causing planets, with best results when
      VPC (Varsha Pravesha Chakra) and AV (Ashtakavarga) also cooperate.
    item_type: FACT_DEFINITION
    referenced_classical_source: "B.V. Raman (300 yogas compilation)"

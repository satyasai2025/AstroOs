    title: "Debilitated lord of a Trika house (6/8/12) aspecting Lagna is Vipareet Raja Yoga"
    claim: >
      IF the lord of the 6th, 8th, or 12th house is debilitated (neecha) AND that
      debilitated lord aspects the Lagna, THEN this forms Vipareet Raja Yoga; the
      page adds that by extension, if such a debilitated Trika-lord aspects some
      other house instead of the Lagna, that other house is said to gain benefit.
    item_type: RULE
    condition_summary: "Debilitated lord of 6th/8th/12th house aspects the Lagna."
    conclusion_summary: "Forms Vipareet Raja Yoga; if aspecting a different house instead, that house gains benefit."
    referenced_classical_source: "BPHS — Rajayoga chapter"

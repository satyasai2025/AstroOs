    section: "Vipareet Raja Yoga"
    title: "Malefic aspecting or conjoining the 3rd or 6th house forms Vipareet Raja Yoga"
    claim: >
      IF a natural malefic planet aspects or conjoins the 3rd house (3H) or 6th house
      (6H), THEN Vipareet Raja Yoga (VRY) is formed by this condition alone, without
      requiring any other simultaneous condition — the page cites this as rule (1) of
      several drawn from BPHS's Rajayoga chapter, while separately noting that if the
      11th lord occupies a Trika house (6th, 8th, or 12th), that instead forms Daridra
      Yoga (poverty combination).
    item_type: RULE
    condition_summary: "A natural malefic planet aspects or conjoins the 3rd or 6th house."
    conclusion_summary: "Vipareet Raja Yoga (VRY) is formed by this condition alone."
    referenced_classical_source: "BPHS — Rajayoga chapter"
    related_concepts: ["vipareet-raja-yoga", "trika-houses", "daridra-yoga"]
    technique_framework: "Parashari"

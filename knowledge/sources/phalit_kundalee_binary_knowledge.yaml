- offset: 1384542
  text: "Numbers 1 to 5 are for five levels of VPC (Varsha Pravesha Chakras).\r\n8 for 360 year Divya-varsha.\r\n9 for 30\
    \ year Divya-month.\r\n10 for 2.5 year Divya-vidasha.\r\n114 for 3000 year-long KaliYuga-vidashaa of Current MahaaYuga.\r\
    \n124 is for 36000 year long KaliYuga-maasa of Current MahaaYuga.\r\n134 is for 432000 year long KaliYuga of Current MahaaYuga.\r\
    \n113 for 6000 year-long DwaaparaYuga-vidashaa of Current MahaaYuga.\r\n123 is for 72000 year long DwaaparaYuga-maasa\
    \ of Current MahaaYuga.\r\n133 is for 864000 year long DwaaparaYuga of Current MahaaYuga.\r\n112 for 9000 year-long TretaaYuga-vidashaa\
    \ of Current MahaaYuga.\r\n122 is for 108000 year long TretaaYuga-maasa of Current MahaaYuga.\r\n132 is for 1296000 year\
    \ long TretaaYuga of Current MahaaYuga.\r\n111 for 12000 year-long SatYuga-vidashaa of Current MahaaYuga.\r\n121 is for\
    \ 144000 year long SatYuga-maasa of Current MahaaYuga.\r\n131 is for 1728000 year long SatYuga of Current MahaaYuga.\r\
    \n7 is for chart at the moment of Sun's Longitude as entered in the large green text \r\nbox above.\r\n\r\nNumbers not\
    \ mentioned above are not allowed.\r\n====================================\r\nAccording to BPHS  (Brihat Parashara Hora\
    \ Shaastra, Sudarshana Chakra \r\nchapter), there are three levels of Varsha-phala kundalis : \r\nfirst is Varsha-pravesha\
    \ chart (VPC); \r\nsecond is eleven Maasa-pravesha charts;(Varsha-pravesha chart is same as first \r\nMaasa-Pravesha chart,\
    \ hence there are 12 monthly charts). \r\nThird level is called Vidashaa in BPHS which is 2.5 degrees of Sun's motion.\
    \ \r\nOther two levels are made by successively diving the previous leven by twelve, and \r\nare merely experimental which\
    \ should not be used for general purposes.\r\n\r\nPROCEDURE :\r\n\r\nIn Medini mode, first select Meru or Vidisha chart\
    \ etc, and then click the 'NOW' \r\nbutton to find out the current numbers of all Varsha-phala levels. Then, in the bottom-\r\
    \nleft two text boxes for Varsha-phala level, enter the Type and Number of level. \r\nFor instance, if you want to make\
    \ the chart of 11th pratyantara/vidashaa, then Type = \r\n3 (i.e., Pratyantara//vidashaa) and Number = 11 after typing\
    \ month number in month \r\nbox.\r\n\r\nFor NAKSHATRA charts :\r\n\r\nInstead of above five Varsha-phala charts, if you\
    \ want Solar Nakshatra Entry charts, \r\nthen Type = 6 and Number = 1 for Ashwini, 2 for Bharani,etc.\r\n\r\nHALF-DEGREE\
    \ charts are experimental : Charts made at intervals of half-degree \r\nof Sun are relevant in Medini Jyotisha (RgVeda,i,164\
    \ : 720 sons of Sun), esp for \r\nanalyzing finer details of Solar Nakshatra charts. Type= 7, and enter  the half-degree\
    \ \r\nin Comments box.\r\n\r\nTIMING :\r\n\r\nIn the 'Chakra' button on Bhaavachalita page, you can get the exact timing\
    \ of \r\nplanets, rasis &c by moving the mouse circularly on the circular chart. Timing in \r\ngiven in both IST and GMT.\
    \ Use standard principles of BPHS to find out astrological \r\nresults for a particular place on Map at a particular timing\
    \ on circular chakra. For \r\ncurrent planets on Map , first get current Sun's longitude by clicking 'NOW' , then \r\n\
    copy this longitude to Comments large green box,enter Type 7 and click SHOW.\r\n\r\nDIVYA Timings :\r\n\r\nFor viewing\
    \ exact timings of Divya varsha of 360 years or Divya-month of 30 years \r\nor KaliYuga-vidashaa of 3000 years, enter\
    \ the year-length in years in the yello box in \r\nmap and find the timing through mouse-motion.\r\nBut for most accurate\
    \ timings of Planets and Bhaava-endings, view in a separate \r\npage headed 'TIMINGS: Yr:Mon:Day ; Hr:Min:Sec'.\r\n\r\n\
    For Code-numbers to be used in Varsha-text box on the left inside the MEDINI \r\nframe, use this table:\r\n=========================================\r\
    \nFor Start of Kali Yuga in Medini, enter \"-3102\" in Year on left side.\r\n\r\nFor Start of Dwaapara Yuga in Medini,\
    \ enter \"-867123\" in Year on left side and \r\nenter \"133\" in text box on the left of medini's \"help\" button.\r\n\
    \r\nFor Start of Treta Yuga in Medini, enter \"-2163154\" in Year on left side and enter \r\n\"132\" in text box on the\
    \ left of medini's \"help\" button.\r\n\r\nFor Start of last Divya-Varsha of Dwaapara Yuga in Medini, enter \"-3462\"\
    \ in Year on \r\nleft side and enter \"8\" in text box on the left of medini's \"help\" button. For previous \r\nDivya-varshas,\
    \ go on substracting 360 successively.\r\n\r\nFor Start of last Vidasha of Dwaapara Yuga in Medini, enter \"-9102\" in\
    \ Year on left \r\nside and enter \"8\" in text box on the left of medini's \"help\" button. For previous \r\nDivya-varshas,\
    \ go on substracting 6000 successively, but remember to increase 1 \r\nyear for every 41712 years. This correction will\
    \ help in going into Vidashaas and \r\nDivya-varshas of Satyuga, Treta or Dwaapar. Same correction for far future."

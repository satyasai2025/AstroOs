- offset: 21093
  text: Type the number of 5th level (=Praan Level) of VPC (Varsha Pravesha Chakra) if you want to view finer level charts
    which lasts for about 25 minutes.
- offset: 21728
  text: Type the number of 2nd level (=solar month starting on Samkraanti) of VPC (Varsha Pravesha Chakra) if you want to
    view finer level charts.
- offset: 22394
  text: Enter numbers for levels of Varsha-phala in Medini . Click 'help' button on right.
- offset: 1280300
  text: 'Gaurava Varshphala (Bhogya or Gata) Varsha : Maas : Din : Ghati : Pala.'
- offset: 1287874
  text: Enter 360 for Divya-Varsha TIMING, 30 for Divya-maasa. Default is 1 year. For Kaliyuga type 432000 after entering
    Kaliyugaadi in Data Form. Then Press ENTER button.
- offset: 1319651
  text: "For human/solar year to be used for Year-length, leave \r\nthe default as  '1' in the yellow text box\r\n\r\n(if\
    \ first solar month is needed in Chakra then put \"11\" \r\nhere),\r\n\r\nbut change it according to initial Data Form's\
    \ Medini-Help.\r\n\r\nDivya Varsha cannot be selected whimsically.\r\nPrevious Divya-Varsha onset was in 1939 AD.\r\n\
    Before Christ, first Divya Varsha was in BC 222.\r\nGo on adding or substracting 360 to get other Divya \r\nVarsha onsets.\r\
    \nAfter you get Divya Varsha onset of the required era, \r\ngo on adding 30 years to find out required Divya Month \r\n\
    for the wanted period.\r\nFor instance, to check 297 BC, enter -582 in the year \r\ntext box of data input form and enter\
    \ '2' in this yellow \r\ntext box here to get Divya-Varsha PHALA for the 360-\r\nyear from 582 BC to 222 BC, but if Divya\
    \ month \r\nPHALA is needed then enter -312 in the data input \r\nform's year box and here in yellow text box select '3'.\
    \ \r\nCurrent Divya Varsha started in 1939 AD, and current \r\nDivya Month in AD 1999."

  - ref: term.bhakoot
    relationship: "Yoni and bhakoot are both factors in the ashtakoota system, but yoni is nakshatra-based while bhakoot is rashi-based"
  - ref: term.gana
    relationship: "Gana (temperament type) works alongside yoni in assessing overall compatibility"

sources:
  - ref: source.BPHS
    chapter: 2

id: term.yoni
name: Yoni
aliases:
  - Yoni
  - Animal Type
  - Animal Instinct
  - योनि
category: term
status: active
confidence: high
version: 1.0
last_verified: 2026-07-15

definition:
  sanskrit: >
    yoni — from yu (to join, to generate) + the suffix -ni.
    Literally "womb, source, origin, or place of birth." In
    jyotisha, each nakshatra is assigned an animal yoni that
    represents the primal instinct and sexual temperament of
    the native.
  english: >
    One of the 14 animal types (yoni) assigned to the 27
    nakshatras in the ashtakoota compatibility system. Each
    yoni represents a primal temperament and instinctual
    nature. Compatibility is assessed by comparing the yoni
    of the bride and groom: same yoni is best, enemy yonis
    are worst. The 14 yonis are: Horse, Elephant, Sheep,
    Snake, Jackal, Peacock, Cat, Mongoose, Tiger, Hare,
    Buffalo, Deer, Monkey, Dog.
  technical: >
    Yoni carries 4 points out of 36 in the ashtakoota system.
    Each nakshatra has a fixed yoni and a fixed yoni partner:
    some yonis are enemies of each other (e.g., cat-mongoose,
    tiger- buffalo), while others are friendly or same. The
    maximum 4 points are awarded when both partners share the
    same yoni; the minimum is for enemy yoni combinations.
    Yoni represents the sexual and instinctual compatibility
    between partners.

usage:
  primary: "Pre-marital compatibility assessment through nakshatra yoni matching (4 of 36 points)"
  secondary: "Assessment of primal temperament and instinctual nature based on birth nakshatra"

related_concepts:
  - ref: term.nakshatra

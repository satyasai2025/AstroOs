    claim: "Describes the yoni classification of nakshatras and their compatibility patterns"
    confidence: high

notes: >
  Yoni matching is weighted at 4 points (tied with Gana at
  6 as among the most important factors). The yoni system
  reflects ancient observations about primal compatibility
  between different temperamental types. Each nakshatra has
  exactly one yoni animal, and each yoni animal has a
  defined enemy partner — these pairings determine the
  lowest compatibility scores.


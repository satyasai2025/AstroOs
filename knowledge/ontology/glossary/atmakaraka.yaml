# === DEFINITION ===

definition:
  sanskrit: >
    ātmakāraka — from ātman (self, soul) + kāraka (significator).
    The graha with the greatest longitude in the natal chart.
  english: >
    In Jaimini astrology, the graha with the highest longitude (most
    advanced in the zodiac) becomes the Atmakāraka — the primary
    soul indicator for the native's life path. It represents the
    soul's primary desire and karmic lesson.

# === CHARA KARAKA SYSTEM ===

chara_karaka_system:
  total_karakas: 8

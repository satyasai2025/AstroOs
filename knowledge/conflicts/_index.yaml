notes: >
  Every conflict record now carries a `cross_references` block (added
  or verified in Phase 6) documenting its real, grep-verified links to
  apps/api/services/rules/*.py (Rule Engine), apps/api/services/*_engine.py
  and packages/shared/constants.py (the Fact Layer feeding the Rule
  Engine), and apps/api/services/ontology_registry.py (Ontology). Where
  no such link exists in code, the record says so explicitly
  (validation_status) rather than asserting one — see conflict.003's
  and conflict.007's cross_references blocks, both of which document
  confirmed implementation gaps rather than fabricated links.

  conflict.005 additionally surfaced a real Ontology/Rule Engine drift
  (ASPECT-SPECIAL-GRAHA's description omits Rahu/Ketu despite
  aspect_engine.py implementing node special aspects) — an engineering
  documentation fix, out of Knowledge Office scope. Filed as a formal
  cross-office request (ER-001) in knowledge/STATUS.md rather than
  corrected here or actioned informally.


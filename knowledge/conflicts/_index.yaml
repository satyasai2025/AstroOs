description: >
  Index of all documented doctrinal conflicts across the knowledge
  repository — points where two or more classical traditions, texts,
  or schools disagree on a specific claim. Phase 6 (Conflict Analysis)
  reviewed the 3 conflicts carried over from earlier phases, linked
  every conflict to its classical sources, the Rule Engine
  (apps/api/services/rules/, aspect_engine.py, and the constants/enum
  tables the Rule Engine's facts are built from), and the Ontology
  (apps/api/domain/ontology.py + ontology_registry.py), and added 4
  newly-surfaced conflicts found during a full-repository survey for
  undocumented disagreements.


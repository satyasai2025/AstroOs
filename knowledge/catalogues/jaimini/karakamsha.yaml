# Jaimini Karakamsha Chart
# The soul-purpose chart: Atmakaraka's D-9 position becomes the Lagna.
# Source: Jaimini Sutras Chapter 1

id: jaimini.karakamsha.chart
name: Karakamsha
aliases: ["Karakamsha Chart", "Atmakaraka Navamsha Lagna", "Soul Chart"]
category: jaimini
status: active
confidence: high
version: 1.0
last_verified: 2026-07-15

system: jaimini
type: divisional-chart
basis: atmakaraka-navamsha

statement: >
  The Karakamsha chart is constructed by taking the Navamsha (D-9)
  position of the Atmakaraka as the Lagna. This special chart reveals
  the soul's purpose, karmic direction, and spiritual trajectory of
  the native. It is one of the foundational analytical tools in the
  Jaimini system.

conditions:
  - entity: graha.atmakaraka
    role: subject
    notes: >
      The Atmakaraka is the graha with the highest degrees in the
      birth chart (excluding Rahu in most traditions). Its Navamsha
      (D-9) position determines the Karakamsha Lagna.
  - entity: divisional.d9
    role: dependency
    notes: >
      The Navamsha chart is used to identify the exact rashi occupied
      by the Atmakaraka. This rashi becomes the Lagna of the
      Karakamsha chart.

construction_method: |
  Step 1: Identify the Atmakaraka (AK) from the Rashi chart.
    - The graha with the highest degrees (within its sign) is the AK.
    - Rahu is excluded from AK consideration in the standard method.
    - In case of a tie, the graha with higherlongitude wins.

  Step 2: Locate the Atmakaraka's position in the D-9 (Navamsha).
    - Find which rashi the AK occupies in the Navamsha chart.

  Step 3: Use that D-9 rashi as the Lagna of the Karakamsha chart.
    - All other graha positions from the D-9 are retained.
    - The chart uses the same D-9 positions but re-referenced from
      the AK's Navamsha rashi as Lagna.

  Step 4: Analyze the Karakamsha chart using standard bhava and
    graha principles, but interpreted through the lens of soul
    purpose and karmic direction.

effects:
  - description: >
      Reveals the native's soul purpose and the direction of their
      spiritual and karmic evolution in this lifetime.
    intensity: strong
  - description: >
      Identifies the bhava (house) themes most relevant to the
      native's deepest life purpose and destined achievements.
    intensity: strong
  - description: >
      Shows the nature of obstacles and support systems along the
      soul's path, as indicated by grahas in the Karakamsha chart.
    intensity: moderate
  - description: >
      Provides insight into past-life karmas that are being worked
      out in the current incarnation.
    intensity: moderate

interpretation_principles: |
  1. The Lagna of Karakamsha represents the soul itself.
  2. The lord of the Karakamsha Lagna indicates the primary mode
     of soul expression.
  3. Planets in the Karakamsha Lagna influence the soul's nature
     directly.
  4. The 7th from Karakamsha shows partnerships and relationships
     relevant to soul growth.
  5. The 10th from Karakamsha reveals the soul's karmic duty
     (dharma) and career direction.
  6. The 12th from Karakamsha indicates moksha (liberation)
     potential and spiritual renunciation.
  7. Atmakaraka's conjunction or aspect in the Karakamsha chart
     intensifies its karmic significance.


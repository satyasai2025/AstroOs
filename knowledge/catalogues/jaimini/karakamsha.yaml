    confidence: high

notes: |
  The Karakamsha chart is unique to the Jaimini system and has no
  direct equivalent in Parashari Jyotish. While Parashari uses
  divisional charts for specific life areas (D-10 for career, D-7
  for children, etc.), the Karakamsha is a re-referenced chart
  built from the D-9 positions.

  Key distinction: The Karakamsha is NOT the same as the Navamsha
  chart. It is a separate analytical chart derived from the
  Navamsha. The Navamsha shows marriage and general strength;
  the Karakamsha shows soul purpose.

  Some traditions distinguish between:
  - Karakamsha Lagna (KL): The AK's D-9 position as Lagna
  - Pada of AK: The specific pada of the AK's nakshatra in D-9
  - AK in rashi chart: The AK's position in the birth chart itself

  All three are used together for comprehensive soul analysis.


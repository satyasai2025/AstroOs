description: >
  Arudha Padas are reflected positions of houses in the chart.
  They show how the world perceives us, rather than our inner reality.
  The Arudha of a house is calculated by counting from the house
  lord's position to the house itself, then applying the same count
  from the Lagna.

# === CALCULATION ===
calculation: >
  1. Identify the lord of a house (e.g., 4th house lord).
  2. Count from the house lord's sign to the house sign.
  3. Apply the same count from the Lagna.
  4. The resulting sign is the Arudha of that house.

# === KEY ARUDHA PADAS ===

# === RASHI DRISHTI SUMMARY ===
rashi_drishti_summary:
  rule_movable: >
    Movable (chara) rashis (Mesha, Karka, Tula, Makara) aspect all
    fixed (sthira) rashis except the immediately zodiacally following
    fixed sign.
  rule_fixed: >
    Fixed (sthira) rashis (Vrishabha, Simha, Vrischika, Kumbha)
    aspect all movable (chara) rashis.
  rule_dual: >
    Dual (dvisvabhava) rashis (Mithuna, Kanya, Dhanus, Meena)
    aspect all other dual rashis.
  total_aspects: 36
  unique_pairs: 18
  reference: jaimini.rashi-drishti.complete

# === CHARA DASHA SUMMARY ===
chara_dasha_summary:
  basis: >
    The starting rashi of Chara Dasha is determined by the Atmakaraka's
    position in the Rashi chart. The dasha sequence follows zodiacal
    order from the AK's occupied rashi.
  direction_rule: >
    If the AK occupies an odd-numbered rashi (1, 3, 5, 7, 9, 11),
    the dasha sequence proceeds forward (ascending order). If the AK
    occupies an even-numbered rashi (2, 4, 6, 8, 10, 12), the dasha
    sequence proceeds backward (descending order).
  period_calculation: >
    Each dasha rashi's period duration is determined by the number
    of rashis the Atmakaraka has traversed within that rashi in
    the Navamsha chart, multiplied by the standard dasha year unit.
  reference: jaimini.chara-dasha

# === KARAKAMSHA SUMMARY ===
karakamsha_summary:
  definition: >
    The Karakamsha is a specialized analytical chart derived from the
    Navamsha (D-9) chart. The Karakamsha Lagna (KL) is the rashi
    that contains the Atmakaraka (AK) in the D-9 chart. This chart
    is considered the "soul's chart" and provides the deepest layer
    of Jaimini analysis.
  significance: >
    The Karakamsha Lagna serves as an alternative reference point to
    the Rashi Lagna. Grahas occupying the KL directly influence the
    soul's expression and life direction. The KL and the Rashi Lagna
    together provide a complete picture: the Rashi Lagna shows the
    worldly personality, while the KL shows the soul's inner nature.
  key_points:
    - "Guru in KL indicates a wise, dharmic soul"
    - "Shukra in KL indicates an artistic, relationship-oriented soul"
    - "Surya in KL indicates an authoritative, powerful soul"
    - "Shani in KL indicates a disciplined, potentially renunciant soul"
    - "The relationship between Rashi Lagna and KL reveals the gap between worldly and soul identity"
  reference: jaimini.karakamsha


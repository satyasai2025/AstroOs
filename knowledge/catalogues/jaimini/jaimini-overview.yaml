    written form.

# === SYSTEM DESCRIPTION ===
description: >
  Jaimini is a distinct school of Jyotish that differs fundamentally
  from the Parashari system in its use of rashi-based (sign-based)
  principles rather than graha-based (planet-based) principles. The
  system was codified by the sage Jaimini in the Jaimini Sutras
  (also known as the Upadesha Sutras). Where Parashari treats
  grahas (planets) as the primary agents of astrological causation,
  Jaimini treats rashis (signs) as the primary structural framework,
  with grahas serving as indicators within that framework.

  The Jaimini system is built upon five interconnected pillars:
  Chara Karakas (dynamic significators), Chara Dasha (rashi-based
  timing), Rashi Drishti (sign aspects), Karakamsha (soul-level
  chart), and Arudha Padas (reflected house indicators). Together,
  these five pillars form a coherent analytical system that
  emphasizes karma, soul purpose, and the dynamic interplay of
  life themes.

# === KEY DIFFERENCES FROM PARASHARI ===
differences:
  - aspect: >
      Rashi Drishti (sign aspects) rather than Graha Drishti
      (planetary aspects). In Jaimini, rashis aspect each other
      based on their nature (movable, fixed, dual) rather than
      through planetary 7th-house or special aspects. Every rashi
      aspects exactly three other rashis, creating a uniform
      structural grid independent of graha placement. See:
      jaimini.rashi-drishti.complete
  - dasha: >
      Chara Dasha (rashi-based) rather than Vimshottari
      (nakshatra-based). Chara Dasha periods are determined by
      the position of the Atmakaraka in the rashi chart, making
      the dasha system personalized to each native's chart. The
      sequence of dasha rashis follows the zodiacal order starting
      from the AK's rashi, with odd-numbered rashis running
      forward and even-numbered rashis running backward (or the
      reverse, depending on the AK's rashi parity). See:
      jaimini.chara-dasha
  - karakas: >
      Chara Karakas (degree-based significators) rather than fixed
      natural karakas (Naisargika Karakas). In Parashari, Surya
      always signifies the Atma (soul) and Chandra always signifies
      the Manas (mind). In Jaimini, the karaka assignments change
      from chart to chart based on the degree each graha holds
      within its occupied rashi. The graha with the highest degrees
      becomes the Atmakaraka. See: jaimini.chara-karakas.system
  - houses: >
      Arudha Padas (reflected houses) rather than direct house
      counting. Arudha Padas are calculated by counting from a
      graha to its natal sign-lord and then reflecting that distance
      from the sign-lord itself. This creates "reflected" or
      "projected" house positions that indicate how the world
      perceives the native's house themes, as opposed to the direct
      house positions indicating internal experience. See:
      arudha.system
  - lagna: >
      Karakamsha (Atmakaraka in D-9) rather than Lagna as the
      primary reference point. While the Rashi Lagna remains
      important, Jaimini gives equal or greater weight to the
      Karakamsha Lagna — the rashi that holds the Atmakaraka in
      the Navamsha (D-9) chart. The Karakamsha Lagna is considered
      the "soul's lagna" and serves as the reference point for
      analyzing soul-level themes. See: jaimini.karakamsha
  - timing: >
      Jaimini uses its own event-triggering rules based on rashi
      drishti interactions during dasha periods, along with
      Argala (intervention) mechanics. Parashari uses transit-
      based triggers (gochara) and planetary period activations.
      Jaimini's approach is more structural and rashi-centric.
  - reference_frame: >
      Parashari uses the Rashi chart with Bhava (house) positions
      as the primary frame. Jaimini uses the Rashi chart with
      emphasis on the Karakamsha Lagna and Arudha Lagna as
      additional reference frames, creating a multi-chart
      analytical approach where the Rashi, Navamsha, Karakamsha,
      and Arudha charts are all examined together.

# === CORE CONCEPTS ===
core_concepts:
  - id: jaimini.chara-karakas.system
    name: Chara Karaka System
    importance: primary
    brief: >
      Eight dynamic significator roles (AK, AmK, Bk, Mk, Pk, PutK,
      GnK, DK) assigned to grahas based on their degree positions
      within their rashis. The system is chart-specific and forms
      the foundation of all Jaimini analysis. The Atmakaraka (AK)
      is the single most important graha in the chart, representing
      the soul itself.
    chapter: 1

  - id: jaimini.chara-dasha
    name: Chara Dasha
    importance: primary
    brief: >
      A rashi-based dasha system where timing periods are determined
      by the Atmakaraka's position in the rashi chart. The dasha
      sequence follows zodiacal order from the AK's rashi, with
      the direction (forward or backward) determined by whether
      the AK occupies an odd or even rashi. Each dasha period
      activates the themes of the operating rashi.
    chapter: 2

  - id: jaimini.rashi-drishti.complete
    name: Rashi Drishti (Sign Aspects)
    importance: primary
    brief: >
      Structural aspect relationships between rashis based on their
      nature: movable rashis aspect fixed rashis (except the adjacent
      one), fixed rashis aspect movable rashis, and dual rashis
      aspect all other dual rashis. Each rashi aspects exactly three
      others, creating a 36 directed-relationship grid (18 unique
      pairs) across the zodiac.
    chapter: 2

  - id: jaimini.karakamsha
    name: Karakamsha
    importance: primary
    brief: >
      A specialized chart derived from the Navamsha (D-9) using the
      Atmakaraka's position. The Karakamsha Lagna (KL) is the rashi
      occupied by the AK in the D-9 chart. This chart reveals the
      soul's inherent tendencies, karmic predispositions, and the
      deepest layer of the native's astrological blueprint. It
      serves as the primary reference frame for Jaimini analysis.
    chapter: 4

  - id: arudha.system
    name: Arudha Padas
    importance: secondary
    brief: >
      Reflected or projected house positions that indicate how the
      world perceives the native's house themes. Calculated by
      counting from a graha to its natal sign-lord, then applying
      the same distance from the sign-lord. The Arudha Lagna (AL)
      is the most important arudha, representing the native's
      public image and material persona.
    chapter: 2

  - id: jaimini.argala
    name: Argala (Intervention)
    importance: secondary
    brief: >
      A Jaimini-specific mechanic where grahas in specific positions
      (2nd, 4th, 11th = beneficial; 12th, 9th, 3rd = obstructive)
      relative to a target rashi create supportive or obstructive
      influences. Argala acts as a weighting system that modifies
      the outcomes of other Jaimini factors.
    chapter: 2

  - id: jaimini.yogas.collection
    name: Jaimini Yogas
    importance: secondary
    brief: >
      A distinct class of planetary combinations arising from chara
      karaka conjunctions, Karakamsha configurations, rashi drishti
      patterns, and argala mechanics. Key yogas include Chara Karaka
      Rajayoga, Karakamsha Lagna Yoga, and Darapada Relationship
      Yoga. These are unique to Jaimini and have no direct Parashari
      equivalent.
    chapter: 1, 4

# === ANALYTICAL WORKFLOW ===
analytical_workflow: |
  The standard Jaimini analytical workflow proceeds through these steps:

  Step 1: Determine Chara Karakas
    - Calculate the degree of each graha within its occupied rashi
    - Rank all 7 grahas (Surya through Shani) from highest to lowest degree
    - Assign the 8 karaka roles (AK through DK)

  Step 2: Identify Key Reference Points
    - Atmakaraka (AK) position in Rashi chart
    - Karakamsha Lagna (AK's rashi in D-9)
    - Arudha Lagna (AL) for public persona
    - Darakaraka (DK) for marriage analysis

  Step 3: Construct Reference Charts
    - Rashi chart (primary)
    - Navamsha/D-9 chart (for Karakamsha derivation)
    - Karakamsha chart (soul-level analysis)
    - Arudha Padas for each bhava

  Step 4: Apply Rashi Drishti
    - Map the rashi aspect grid for all 12 rashis
    - Identify rashi-level connections between key karakas
    - Note rashi drishti patterns involving AK, AmK, DK

  Step 5: Evaluate Argala
    - Apply beneficial argala positions (2nd, 4th, 11th)
    - Apply obstructive argala positions (12th, 9th, 3rd)
    - Determine net argala support for key rashis

  Step 6: Identify Jaimini Yogas
    - Check for karaka conjunctions and exchanges
    - Evaluate Karakamsha Lagna graha placements
    - Assess AK position relative to Lagna (kendra/trikona)
    - Examine Darapada relationship to KL

  Step 7: Timing through Chara Dasha
    - Determine the starting rashi of Chara Dasha from AK position
    - Map the full dasha sequence
    - Identify which dasha period activates the relevant yogas
    - Cross-reference with Parashari Vimshottari for corroboration

# === RELATIONSHIP TO PARASHARI ===
relationship_to_parashari: >
  Jaimini and Parashari are considered complementary systems, not
  contradictory. Many practitioners use both in their chart analysis.
  Where they agree, the prediction is strengthened. Where they
  disagree, both positions should be documented and weighed using
  additional confirmation factors (transits, varshaphal, prashna).

  In modern practice, most serious Jyotish practitioners work
  within a Parashari framework for bhava analysis, graha effects,
  and yogas, while incorporating Jaimini techniques for karaka-
  based analysis, rashi drishti patterns, and soul-level themes
  through the Karakamsha.

  The key philosophical difference: Parashari emphasizes what
  happens to the native (event-focused), while Jaimini emphasizes
  why it happens to the native (karma/soul-focused).

# === TEXTUAL TRADITION ===
textual_tradition:
  primary_text:
    ref: source.jaimini-sutras
    name: Jaimini Sutras (Upadesha Sutras)
    chapters: 4
    structure: >
      The text consists of approximately 1000 terse sutras (aphorisms)
      organized into 4 chapters. The sutra format is deliberately
      cryptic, requiring commentary for full understanding. This has
      led to multiple interpretive traditions.

  key_commentaries:
    - ref: source.jaimini-sutras-sharma
      name: "Sharma Commentary (2003)"
      notes: "Standard modern commentary by D.K. Sharma, published by Sagar Publications"
    - name: "Sanjay Rath Commentary"
      notes: >
        A widely followed modern commentary emphasizing the Crasis
        method and specific interpretive traditions within the
        Jaimini system. Diverges from Sharma on several key points
        including dasha computation and karaka rankings.
    - name: "B.V. Raman Commentary"
      notes: >
        Includes Jaimini interpretations within the broader Parashari
        framework, making it accessible to practitioners primarily
        trained in the Parashari system.

  chapter_summary:
    - chapter: 1
      name: "Pada Adhyaya"
      topics: ["Chara Karakas", "Graha effects", "Phalita Jyotish"]
      key_concepts: ["jaimini.chara-karakas.system"]
    - chapter: 2
      name: "Phala Adhyaya"
      topics: ["Chara Dasha", "Rashi aspects", "Argala", "Arudha Padas"]
      key_concepts: ["jaimini.chara-dasha", "jaimini.rashi-drishti.complete", "jaimini.argala", "arudha.system"]
    - chapter: 3
      name: "Nakshatra Adhyaya"
      topics: ["Nakshatra effects", "Drekkana"]
      key_concepts: []
    - chapter: 4
      name: "Vishishta Adhyaya"
      topics: ["Karakamsha", "Chara Dasha details", "Special yogas"]
      key_concepts: ["jaimini.karakamsha", "jaimini.yogas.collection"]


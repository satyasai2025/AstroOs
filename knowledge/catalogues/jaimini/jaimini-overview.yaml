# === NOTES ===
notes: >
  The Jaimini system is less standardized than Parashari. Different
  commentators (Sharma, Sanjay Rath, B.V. Raman) interpret the sutras
  differently on several key points, including:

  1. Whether Shani is excluded from certain chara karaka positions
  2. The exact computation method for Chara Dasha period durations
  3. The specific rules for arudha pada calculation in edge cases
  4. Whether Rahu and Ketu participate in the chara karaka scheme

  The system is often used in conjunction with Parashari, not as a
  replacement. When Parashari and Jaimini agree on a prediction, the
  confidence level increases significantly. When they disagree, both
  positions should be documented.

  The Karakamsha Lagna is considered by many Jaimini practitioners
  to be as important as, or more important than, the Rashi Lagna
  for understanding the native's soul purpose and karmic trajectory.
  This is one of the most distinctive contributions of the Jaimini
  system.


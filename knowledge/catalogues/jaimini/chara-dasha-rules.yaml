notes: |
  This entry provides detailed Jaimini-specific rules for the Chara
  Dasha system. For the general overview entry, see dasha.chara.

  Duration Variation Note:
  The durations used in this entry (movable 2, fixed 5, dual 7)
  represent one tradition of Jaimini interpretation. Alternative
  values found in some texts and the existing dasha.chara entry
  use movable 2, fixed 3, dual 1 (totaling 24 years per cycle).
  The variation arises from different commentarial traditions on
  the Jaimini Sutras. The user of this knowledge base should be
  aware that different Jaimini schools may employ different
  duration values.

  Comparison with Parashari Dasha Systems:
  - Vimshottari: Nakshatra-based, fixed 120-year cycle, graha-ruled
  - Chara Dasha: Rashi-based, variable cycle length, sign-ruled
  - The fundamental difference is that Chara Dasha operates on
    rashis (signs) rather than nakshatras (lunar mansions).

  The Atmakaraka starting point makes Chara Dasha inherently
  personal — the same birth date will produce different dasha
  sequences depending on the AK, creating a unique timing
  framework for each individual.


    confidence: high

notes: |
  Jaimini yogas are fundamentally different from Parashari yogas:

  Parashari Yogas:
  - Based on bhava lord relationships (conjunction, exchange, aspect)
  - Fixed graha-based rules (e.g., Gaja Kesari = Guru in kendra from Chandra)
  - Apply universally regardless of degree positions
  - See: yogas.raja.*

  Jaimini Yogas:
  - Based on chara karaka positions and relationships
  - Dynamic — depend on degree-based karaka assignments
  - Include Karakamsha-based and argala-based formations
  - This file (jaimini.yogas.collection)

  Both systems can be applied to the same chart. A chart may show
  Parashari Rajayoga through bhava lord connections AND Jaimini
  Rajayoga through karaka conjunctions simultaneously, creating
  layered indicators of success.

  The argala mechanic is unique to Jaimini and provides an
  additional layer of analysis not available in Parashari. It
  acts as a "weighting" system — grahas in beneficial argala
  positions strengthen the target, while those in obstructive
  positions weaken it.


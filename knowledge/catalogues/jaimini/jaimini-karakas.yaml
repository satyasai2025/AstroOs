      Jaimini Sutras Chapter 1 establish the Chara Karaka system
      with eight ranks (AK through DK) determined by planetary
      degree positions. The system is the foundation of Jaimini
      analysis.
    confidence: high

notes: |
  The Chara Karaka system is the cornerstone of Jaimini astrology.
  Unlike Parashari, where significations are fixed to grahas, the
  Jaimini system assigns them dynamically based on the chart's
  specific configuration.

  Key Analytical Points:
  1. The AK is always the most important graha in Jaimini analysis.
  2. The AK's house, sign, conjunctions, and aspects reveal the
     soul's primary orientation.
  3. The Amatyakaraka (AmK) indicates career and guidance.
  4. The Darakaraka (DK) reveals spouse nature and marriage quality.
  5. All eight karakas work together to paint a complete picture
     of the native's life themes.

  In practice, the chara karakas are used alongside (not instead
  of) the naisargika karakas for comprehensive chart analysis.


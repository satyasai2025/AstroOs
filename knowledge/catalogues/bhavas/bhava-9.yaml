notes: >
  The 9th house (Dharma Bhava) is considered the most auspicious house
  in the horoscope. As a Trikona (trinal) house, it represents dharma,
  good fortune, and divine grace. It governs religion, spiritual
  preceptors, father, and long-distance travel. Guru as natural
  karaka reinforces the expansive, benevolent nature of this
  bhava. The 9th lord (Bhagyapati) is a key indicator of fortune
  and ethical living.


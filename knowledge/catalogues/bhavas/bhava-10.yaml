notes: >
  The 10th house (Karma Bhava) is the highest point in the
  chart (MC/Midheaven equivalent) and represents one's
  public standing, career, and contribution to society. As a
  Kendra house, it is inherently strong. The 10th lord's
  placement and strength are critical indicators of
  professional success. Both Surya (authority) and Shani
  (discipline, karma) serve as natural karakas, reflecting
  the house's dual association with power and duty.


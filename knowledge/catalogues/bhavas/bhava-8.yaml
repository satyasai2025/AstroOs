notes: >
  The 8th house (Randhra Bhava) is a Dusthana (difficult house)
  representing longevity, transformation, and hidden matters.
  It is the most intense of the three Dusthana and governs
  sudden life changes, inheritance, and occult knowledge.
  A strong 8th house can bestow a long life and profound
  spiritual insight. The 8th lord (Ayushpati) is a key
  indicator of lifespan in longevity calculations.


notes: >
  The 11th house (Labha Bhava) is one of the upachaya
  (increasing) houses and represents gains, income, and the
  fulfillment of desires. As a house of aspirations, it
  shows what the native strives for and ultimately achieves.
  Guru as natural karaka reinforces the association with
  expansion, prosperity, and noble aspirations. Malefics in
  the 11th house are often considered beneficial as they
  drive ambitious pursuit of goals.


notes: >
  BNN timing principles: (1) The primary timing mechanism is nakshatra-based
  transit — when a planet transits the nakshatra that activates a Nadi
  combination, the predicted event manifests. (2) The timing sequence follows
  the natural order of nakshatras from the Lagna nakshatra. (3) Each Nadi
  combination has an associated timing window based on which planet is the
  "trigger" planet. (4) The trigger planet's transit through its own linked
  nakshatra or the nakshatra of its combination partner indicates the event
  period. (5) BNN timing can be layered: the annual theme (from the annual
  nakshatra progression) sets the year's focus, and transit-based timing
  pinpoints the event within the year. (6) Some practitioners combine BNN
  timing with Vimshottari Dasha for cross-validation. (7) BNN's strength is
  that it can predict event timing from the birth chart alone, without requiring
  divisional chart progression. (8) The system's accuracy depends on correct
  identification of the Nadi combinations in the chart.


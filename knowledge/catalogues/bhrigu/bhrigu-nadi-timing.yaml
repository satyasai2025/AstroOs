system: bhrigu
statement: >
  Bhrigu Nandi Nadi uses its own timing framework that differs from standard
  Vimshottari Dasha. BNN timing is based on the nakshatra positions of
  planets: the timing of events is derived from when planets transit or
  activate specific nakshatras linked to the Nadi combinations in the chart.
  The system uses nakshatra-based period calculations where the nakshatra lord
  of the triggering planet determines the timing window. Additionally, BNN
  incorporates annual and sub-annual timing through the progression of
  planetary nakshatra activations.


system: bhrigu
statement: >
  Bhrigu Nandi Nadi (BNN) is a nakshatra-based predictive system that uses
  specific planetary combinations (yogas) derived from nakshatra lordships
  rather than sign-based analysis. The core principle is that each nakshatra
  padas carry specific karmic imprints, and when planets occupy certain
  nakshatras, the nakshatra-based combinations produce predictable life
  patterns. BNN uses a simplified house system where the Lagna and its
  nakshatra set the framework, and planetary nakshatra ownership determines
  results. Planets are evaluated primarily through their nakshatra positions
  rather than sign positions.


notes: >
  BNN core principles: (1) The system is rooted in the ancient Nadi tradition,
  attributed to the sage Bhrigu. (2) Predictions are nakshatra-centric — each
  planet's nakshatra and its lord determine outcomes. (3) When two or more
  planets share the same nakshatra lord, they form a Nadi yoga that produces
  specific life patterns. (4) The Lagna nakshatra is the starting point for
  all analysis. (5) BNN uses a minimal set of tools: nakshatras, planetary
  ownership of nakshatras, and specific Nadi combinations. (6) The system is
  considered predictive from birth data alone, without requiring extensive
  divisional chart analysis. (7) BNN combinations often describe specific
  life events (marriage timing, career events, health issues) through
  nakshatra-based logic rather than sign or house-based logic. (8) The
  system operates on the principle that nakshatras carry karmic information
  more precisely than rashis.


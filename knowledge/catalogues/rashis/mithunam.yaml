notes: >
  Mithuna is the third sign of the zodiac, governing communication and
  intellectual exchange. As a dual air sign, it embodies curiosity,
  adaptability, and a restless pursuit of knowledge. Natives born under
  Mithuna are said to be versatile, articulate, and mentally agile. The
  sign corresponds to the arms and shoulders (Bhuja) in the Kalapurusha
  correspondence of the zodiac to the human body.


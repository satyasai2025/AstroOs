notes: >
  Tula is the seventh sign of the zodiac, governing relationships,
  balance, and social harmony. As a cardinal air sign, it embodies
  diplomacy, aesthetics, and a strong sense of justice. Natives born
  under Tula are said to be charming, diplomatic, and relationship-
  oriented. The sign corresponds to the lower back and waist (Kati) in
  the Kalapurusha correspondence of the zodiac to the human body. Tula
  is the sign of the autumnal equinox in sidereal astrology.


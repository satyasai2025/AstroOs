notes: >
  Kanya is the sixth sign of the zodiac, governing analysis, service,
  and practical intelligence. As a dual earth sign, it embodies
  meticulous attention to detail, discrimination, and a methodical
  approach to life. Natives born under Kanya are said to be analytical,
  hardworking, and devoted to service. The sign corresponds to the
  abdomen (Udara) in the Kalapurusha correspondence of the zodiac to
  the human body.


notes: >
  Mesham is the first sign of the zodiac, initiating the
  cycle of the seasons with the vernal equinox. As a cardinal
  fire sign, it embodies raw initiative, courage, and the
  drive to begin. Natives born under Mesham are said to be
  pioneers with strong physical vitality and a natural
  leadership instinct. The sign corresponds to the head
  (Shiras) in the Kalapurusha correspondence of the zodiac
  to the human body. Mesham is the only sign ruled by
  Mangala (Mars).


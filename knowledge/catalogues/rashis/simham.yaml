notes: >
  Simha is the fifth sign of the zodiac, radiating authority and
  creative self-expression. As a fixed fire sign, it embodies regal
  dignity, courage, and a generous spirit. Natives born under Simha are
  said to be natural leaders with a strong sense of pride and honour.
  The sign corresponds to the heart (Hridaya) in the Kalapurusha
  correspondence of the zodiac to the human body. Simha is the only
  sign ruled by Surya (the Sun).


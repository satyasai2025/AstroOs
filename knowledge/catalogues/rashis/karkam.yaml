notes: >
  Karka is the fourth sign of the zodiac, ruling the domain of emotions
  and domestic life. As a cardinal water sign, it embodies nurturing
  energy, deep sensitivity, and protective instincts. Natives born under
  Karka are said to be deeply emotional, intuitive, and family-oriented.
  The sign corresponds to the chest and breasts (Hridaya) in the
  Kalapurusha correspondence of the zodiac to the human body. Karka is
  the only sign ruled by Chandra (the Moon).


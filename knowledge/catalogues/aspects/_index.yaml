id: aspect.index
name: Aspects Catalogue Index
aliases:
  - Aspect Index
  - Drishti Index
category: aspect
status: active
confidence: high
version: 1.0
last_verified: 2026-07-15

statement: >
  Master index of all aspect catalogue records. This file cross-references
  every YAML record in the catalogue/aspects/ directory for quick lookup.

records:
  - file: graha-standard-aspects.yaml
    id: aspect.graha-drishti.7th
    name: Standard Seventh-House Aspect
    type: graha-drishti
    summary: Every graha aspects the 7th house from its position.

  - file: guru-special-aspects.yaml
    id: aspect.special.guru
    name: Guru Special Aspects
    type: graha-drishti
    summary: Guru aspects 5th and 9th houses in addition to 7th.

  - file: shani-special-aspects.yaml
    id: aspect.special.shani
    name: Shani Special Aspects
    type: graha-drishti
    summary: Shani aspects 3rd and 10th houses in addition to 7th.

  - file: mangala-special-aspects.yaml
    id: aspect.special.mangala
    name: Mangala Special Aspects
    type: graha-drishti
    summary: Mangala aspects 4th and 8th houses in addition to 7th.

  - file: rahu-ketu-aspects.yaml
    id: aspect.special.rahu-ketu
    name: Rahu and Ketu Aspects
    type: graha-drishti
    summary: Rahu and Ketu aspect 5th, 7th, and 9th (Guru pattern).

  - file: rashi-drishti-rules.yaml
    id: aspect.rashi-drishti.rules
    name: Rashi Drishti Rules
    type: graha-drishti
    summary: Sign-based aspects derived from sign lordships and natural relationships.

  - file: rashi-drishti-table.yaml
    id: aspect.rashi-drishti.table
    name: Rashi Drishti Table
    type: graha-drishti
    summary: Complete table of which signs aspect which other signs.

  - file: conjunction-effects.yaml
    id: aspect.conjunction.effects
    name: Conjunction Effects
    type: graha-drishti
    summary: Effects produced when grahas occupy the same sign (0-degree aspect).

  - file: aspect-strength.yaml
    id: aspect.special.strength
    name: Aspect Strength Hierarchy
    type: special
    summary: Hierarchy of aspect strength — full > special > argala > rashi.

  - file: argala-rules.yaml
    id: aspect.argala.rules
    name: Argala (Intervention) Rules
    type: argala
    summary: Intervention from 2nd, 4th, 11th houses; blocking from 12th, 10th, 3rd.

  - file: aspect-summary-table.yaml
    id: aspect.summary.table
    name: Aspect Summary Table
    type: graha-drishti
    summary: Master reference listing all aspects for each of the nine grahas.

notes: >
  This index contains 11 records covering the complete aspect system:
  graha drishti (standard and special), rashi drishti, conjunction,
  argala, strength hierarchy, and summary reference. All records follow
  the standard aspect YAML schema with id, name, category, status,
  confidence, version, aspect_type, statement, conditions, effects,
  exceptions, sources, notes, and history fields.

history:
  - version: 1.0
    date: 2026-07-15
    change: "Initial catalogue index"
    author: "Chief Jyotish Knowledge Architect"

notes: |
  This catalogue centralizes the karakatva assignments from BPHS Ch.33 for all 9 grahas.
  These are the NATURAL significators (naisargika karaka) -- they apply regardless of
  placement, conjunction, or aspect. Positional, dispositor-based, and conditional
  karakatvas are derived separately.

  Key principles:
  1. Each graha is the natural karaka for specific bhavas and life areas
  2. Karakatvas operate at multiple levels: physical (dhatu), functional (bhava), and spiritual
  3. Rahu-Ketu axis represents the material-spiritual polarity
  4. Natural karakatvas are universal; their expression varies by placement


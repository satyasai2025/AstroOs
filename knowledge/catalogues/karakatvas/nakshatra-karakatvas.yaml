notes: |
  This catalogue centralizes the nakshatra karakatva assignments from BPHS and Phaladeepika.
  Each nakshatra has its deity, symbol, and multiple significations that operate across
  physical, functional, and spiritual levels.

  Key principles:
  1. Each nakshatra is ruled by a graha and has a presiding deity
  2. Nakshatra significations influence the bhavas they occupy
  3. The 4 padas of each nakshatra add additional nuance
  4. Nakshatra themes are particularly relevant for muhurta (electional) and nakshatra-based predictions


notes: |
  This catalogue centralizes the bhava karakatva assignments from BPHS. Each bhava has
  a natural karaka graha and multiple significations. The bhava-karaka relationship is
  fundamental to chart interpretation.

  Key principles:
  1. Each bhava has a primary natural karaka graha
  2. Bhavas signify both positive and negative outcomes depending on graha placement
  3. Opposing bhavas (axes) represent complementary life polarities
  4. The 1st bhava (Lagna) is the reference point for all other bhavas


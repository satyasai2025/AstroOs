    notes: "Personal initiative versus divine grace and dharma"
  - axis: 4-10
    theme: "Home vs. Career, Private vs. Public"
    bhavas: [bhava.4, bhava.10]
    notes: "Domestic life versus public persona and professional identity"
  - axis: 5-11
    theme: "Children vs. Gains, Individual vs. Community"

# === NOTES ===

notes: >
  Chandra is the fastest-moving graha in the zodiac (~13° per day).
  Its waxing and waning phases symbolize the fluctuating nature of
  the mind. In Parashari astrology, a strong Chandra indicates
  emotional stability, intuition, and a nurturing disposition.
  Chandra is neutral in a general sense but considered a natural
  benefic due to its cooling, gentle influence.


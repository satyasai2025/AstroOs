# === NOTES ===

notes: >
  Guru is the teacher of the devas and the greatest natural benefic.
  It represents wisdom, prosperity, children, and spiritual growth.
  A strong Guru in a chart bestows optimism, ethical living, and
  good fortune. Guru's exaltation in Karka (sign of the mother)
  underscores its nurturing, protective quality. Guru transits
  through one sign per year, completing its full zodiac cycle in
  approximately 12 years.


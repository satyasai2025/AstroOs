# === NOTES ===

notes: >
  Shukra is the teacher of the asuras and the most powerful
  natural benefic in many classical texts. It governs love,
  beauty, wealth, creativity, and relationships. A well-placed
  Shukra bestows artistic talent, charm, and material prosperity.
  As the graha closest to Earth (excluding the Moon), its appearance
  as the morning or evening star has deep symbolic significance
  in Vedic mythology. Shukra grants the longest Vimshottari dasha
  at 20 years.


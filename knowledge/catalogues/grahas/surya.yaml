# === NOTES ===

notes: >
  Surya is regarded as the king among the grahas, signifying the soul
  (atman), the father, and worldly authority. Despite its sattvic
  quality and role as the source of light and life, it is classified
  as a natural malefic due to its intense heat and dominating nature.
  Surya is exalted in Mesha (10°) and debilitated in Tula (10°); its
  moolatrikona and own sign are both Simha. In Jaimini astrology,
  Surya is frequently the Atmakaraka when it holds the highest degree
  among the seven classical grahas, reinforcing its role as significator
  of the soul's purpose.


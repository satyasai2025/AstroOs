notes: >
  Tajika timing hierarchy: (1) Annual chart (Varshaphal) — cast at solar return,
  governs the year. (2) Monthly chart (Masaphal) — cast when the Sun enters the
  next sign after the solar return position; the Muntha also advances one sign.
  (3) Weekly chart (Saptahaphal) — cast when the Sun changes sign within the
  current month. (4) Daily chart (Dinaphal) — cast at local sunrise each day.
  (5) Istimrari is the systematic progression: start with the annual chart, then
  examine the relevant monthly chart, then weekly, then daily — each narrower
  window confirms or refines the broader prediction. (6) The monthly chart uses
  the same house system and aspect rules as the annual chart. (7) When multiple
  sub-period charts agree on a prediction, confidence increases. (8) When they
  conflict, the most specific chart (daily) takes precedence for timing, while
  the broader chart (annual) governs the overall theme.


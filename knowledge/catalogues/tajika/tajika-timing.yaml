system: tajika
statement: >
  Tajika timing uses progressive chart refinement: annual (Varshaphal),
  monthly (Masaphal), weekly (Saptahaphal), and daily (Dinaphal) charts.
  The annual chart governs the year; the monthly chart (cast when the Sun
  enters each sign during the year) refines to monthly themes; the weekly
  chart (cast on each day the Sun changes sign within the month) refines
  further; and the daily chart (cast each day at sunrise) provides daily
  granularity. Istimrari refers to the progression technique where the annual
  chart is further refined through these sub-periods. Each sub-period chart
  is cast using the same cusp calculation method as the annual chart.


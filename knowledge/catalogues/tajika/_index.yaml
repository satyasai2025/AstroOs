notes: >
  Tajika is an annual prediction system with roots in Persian astrology that
  was integrated into Indian Jyotish. Its primary text is the Tajika Nihanti.
  The system's three pillars are: (1) Annual chart (Varshaphal) based on the
  solar return, (2) Tajika-specific yogas centered on Ittalaqa and Sahama, and
  (3) Progressive timing refinement (Istimrari) from year to day. Tajika
  predictions layer over natal chart promises and ongoing Dasha periods rather
  than replacing them.


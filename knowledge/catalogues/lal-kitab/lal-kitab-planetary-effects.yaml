system: lal-kitab
statement: >
  Planets in houses produce effects in Lal Kitab that differ significantly from
  classical Parashari interpretations. The Lal Kitab effect system is based on
  two principles: sitting effects (planet in a house) and aspecting effects
  (planet aspects the house opposite). A planet in the 1st house aspects the
  7th; a planet in the 2nd aspects the 8th, and so on. Additionally, Lal Kitab
  assigns fixed body-part and family-member rulerships to each house, and
  planets in those houses directly affect those areas. No planet is inherently
  benefic or malefic — the effect depends entirely on house placement and
  ownership.

conditions:
  - entity: graha.placement
    role: subject
    detail: "A planet's effect is determined by its house position (sitting) and the house it aspects (7th from itself)"

  - entity: graha.ownership
    role: framework
    detail: "House ownership combined with placement determines whether the planet acts positively or negatively"

effects:
  - description: "Sitting effect: planet in a house directly influences that house's significations"
    intensity: strong
  - description: "Aspecting effect: planet aspects the 7th house from its position, influencing that house's domain"
    intensity: strong
  - description: "Ownership effect: planet owning a house acts as that house's agent wherever placed"
    intensity: strong
  - description: "No planet is permanently benefic or malefic — effects shift based on house dynamics"
    intensity: moderate

sources:

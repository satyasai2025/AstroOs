    claim: "Lal Kitab planetary effects: Unique to Lal Kitab — planets in houses produce different effects than classical system."
    confidence: high

notes: >
  Lal Kitab planetary effect rules: (1) A benefic planet sitting in a good house
  strengthens that house but its opposite house may weaken. (2) A malefic planet
  sitting in a bad house may actually strengthen it by afflicting it less than
  expected. (3) The sitting-aspecting framework creates a simple two-house
  analysis for each planet. (4) If the 1st house has a benefic planet, it
  strengthens self and aspects the 7th (partnership) positively. (5) If the
  2nd house has a malefic, it may cause family disputes and its aspect on the
  8th creates obstacles. (6) Planetary friendship and enmity in Lal Kitab
  sometimes differs from Parashari. (7) The effects accumulate: multiple
  planets in a house create layered results based on each planet's sitting
  and aspecting behavior. (8) Empty houses derive their strength from their
  owner — if the owner is well-placed, the empty house functions properly.


system: lal-kitab
statement: >
  Lal Kitab prescribes specific, practical remedies (upayas) for planetary
  afflictions that are distinct from classical Jyotish remedial measures. These
  remedies involve donating specific items, wearing particular substances,
  performing specific actions, and feeding animals. Remedies are tied to
  specific house afflictions and planetary positions, and are designed to be
  accessible and actionable without elaborate rituals.


notes: >
  Lal Kitab remedy principles: (1) Remedies are based on house position, not
  just planetary ownership. (2) A common remedy for a planet in a bad house is
  to feed or donate items associated with that planet. (3) Example: if the
  Sun is afflicted, one should feed wheat to the poor or serve father figures.
  (4) If Saturn is problematic, donate iron items or feed crows. (5) The
  remedy system is designed for everyday practice — no elaborate puja or
  mantra is typically required. (6) Some remedies are preventative (to
  strengthen a weak planet) while others are curative (to reduce an afflicting
  planet's impact). (7) Lal Kitab remedies also include specific behaviors to
  avoid — for instance, certain houses forbid specific actions when planets
  are placed there. The remedy framework is one of Lal Kitab's most
  distinctive contributions, making astrology actionable for ordinary people.


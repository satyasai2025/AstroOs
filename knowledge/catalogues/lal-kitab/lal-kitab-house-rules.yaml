notes: >
  Lal Kitab house significations have key differences from Parashari: (1) Each
  house has a fixed body-part ruling that does not change. (2) Planets in houses
  produce effects through a "sitting and aspecting" framework unique to Lal Kitab.
  (3) A planet only aspects the house directly opposite (7th from itself), with
  additional Lal Kitab-specific aspect rules. (4) The 7th house from Lagna aspects
  the Lagna itself — a planet in the 7th aspects the 1st. (5) If a house is
  occupied, its owner's effects are felt; if empty, the house owner's effects are
  weak. (6) No planet is considered truly malefic or benefic — effects depend on
  house placement and ownership.


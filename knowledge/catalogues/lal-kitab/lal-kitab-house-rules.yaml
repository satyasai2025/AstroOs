system: lal-kitab
statement: >
  Each of the 12 houses in Lal Kitab has specific fixed significations that
  differ from classical BPHS (Brihat Parashara Hora Shastra). The Lal Kitab
  house system assigns unique body-part associations, family-member mappings,
  and event domains. Houses also have specific interactions: the 7th house
  aspects the 1st, the 4th aspects the 10th, and the 8th aspects the 2nd
  ( Lal Kitab directional aspects). Each house has dedicated remedies (upayas)
  when afflicted.


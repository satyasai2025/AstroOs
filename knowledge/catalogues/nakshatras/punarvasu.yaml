notes: >
  Punarvasu is the seventh nakshatra, spanning from late Mithuna into
  early Karka (20° Mithuna to 3°20' Karka). Ruled by Guru in the
  Vimshottari system, it is presided over by Aditi, the mother of the
  gods. Its shakti is the power to regain what was lost. The first
  three padas fall in Mithuna with Vrishabha-Mithuna-Karka navamsha;
  the fourth pada is in Karka with Simha navamsha. As a deva-gana,
  sattvic nakshatra with a renewing temperament, it bestows optimism,
  generosity, and the capacity for renewal and fresh starts.


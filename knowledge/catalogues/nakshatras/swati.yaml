notes: "Swati is the 15th nakshatra, spanning 6°40' to 20°00' of Tula (Libra). It is ruled by Rahu and its deity is Vayu, the god of wind. The shakti is Vyapani — the power to scatter like wind. Swati natives are independent, adaptable, and free-moving. Arcturus, the brightest star in the northern hemisphere, marks this nakshatra."


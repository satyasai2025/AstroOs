notes: "Anuradha is the 17th nakshatra, spanning 3°20' to 16°40' of Vrishchika (Scorpio). It is ruled by Saturn (Shani) and its deity is Mitra, god of friendship and harmony. The shakti is Radana — the power to radiate and connect. Anuradha natives are friendly, devoted, and skilled at building harmonious relationships. The star is Beta Scorpii."


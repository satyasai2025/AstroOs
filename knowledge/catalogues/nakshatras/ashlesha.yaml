notes: >
  Ashlesha is the ninth nakshatra, entirely within Karka (16°40' to
  30° Karka). Ruled by Budha in the Vimshottari system, it is
  presided over by Shesha, the king of the Nagas. Its shakti is the
  power to entwine. All four padas reside in Karka with navamsha
  progression through Makara-Kumbha-Mesha-Mesha. As a rakshasa-gana,
  tamasic nakshatra with a secretive temperament, it bestows hidden
  knowledge, hypnotic power, and the capacity to wield both poison
  and its antidote. The final nakshatra of Karka marks the completion
  of the emotional water sign's journey.


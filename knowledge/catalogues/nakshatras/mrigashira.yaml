notes: >
  Mrigashira is the fifth nakshatra, spanning from late Vrishabha into
  early Mithuna (23°20' Vrishabha to 6°40' Mithuna). Ruled by Mangala
  in the Vimshottari system, it is presided over by Soma (the Moon
  deity). Its shakti is the power of seeking. The first two padas fall
  in Vrishabha with Kanya and Tula navamsha; padas three and four are
  in Mithuna with Vrishchika and Dhanus navamsha. As a deva-gana,
  rajasic nakshatra with a searching temperament, it confers curiosity,
  investigative ability, and a restless seeking nature.


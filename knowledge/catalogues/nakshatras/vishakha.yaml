notes: "Vishakha is the 16th nakshatra, spanning 20°00' Tula to 3°20' Vrishchika. It is ruled by Jupiter (Guru) and its deity is the dual aspect Indra-Agni. The shakti is Vyuhana — the power to aim and achieve. Vishakha natives are ambitious, competitive, and driven toward their goals. The star marking this nakshatra is Zubenelgenubi (Alpha Librae)."


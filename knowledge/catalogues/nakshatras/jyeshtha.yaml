notes: "Jyeshtha is the 18th nakshatra, spanning 16°40' to 30°00' of Vrishchika (Scorpio). It is ruled by Mercury (Budha) and its deity is Indra, king of the gods. The shakti is Aarohana — the power to protect and rule. Jyeshtha natives are authoritative, protective, and naturally command respect. Antares, one of the brightest stars in the sky, marks this nakshatra and gives it a fiery, martial quality."


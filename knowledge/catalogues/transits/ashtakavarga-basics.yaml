    confidence: high

notes: >
  Ashtakavarga is one of the most powerful quantitative tools in Jyotish for
  assessing house strength. It provides a numerical foundation for transit
  interpretation — without Ashtakavarga, transit analysis relies solely on
  qualitative assessment of graha nature and house ownership. The system is
  detailed and requires careful calculation using the contribution rules for
  each graha. This entry provides only the foundational concepts; full
  calculation tables, contribution rules, and worked examples are in BPHS Ch.39.
  The 7 grahas used in calculation are the visible planets — Rahu and Ketu are
  excluded from Ashtakavarga calculation.


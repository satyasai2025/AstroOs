version: 1.0
last_verified: 2026-07-15

rule_type: ashtakavarga
statement: >
  Ashtakavarga is a quantitative system that assigns points (bindus) to each
  of the 12 houses in a natal chart based on the positions of the 7 visible
  grahas (Surya, Chandra, Mangala, Budha, Guru, Shukra, Shani) relative to
  each other. Each graha contributes up to 8 points to each house, and the
  total points in a house indicate its strength. Higher bindus = stronger house.
  The system is used to evaluate transit effects: when a benefic transits a
  strong house (high bindus), the results are positive; when a malefic transits
  a weak house (low bindus), challenges arise. BPHS Ch.39.


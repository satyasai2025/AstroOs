# ── SADE SATI ────────────────────────────────────────────────────────────────

id: transit.shani.sade-sati
name: "Sade Sati — Saturn's 7.5-Year Period"
aliases: ["Sade Sati", "Sade Sati Period", "7.5 Year Saturn Transit"]
category: transit
status: active
confidence: high
version: 1.0
last_verified: 2026-07-15

rule_type: gochara
statement: >
  Sade Sati is the 7.5-year period during which Saturn transits through the
  12th, 1st, and 2nd houses from the natal Moon (Chandra). Each rashi transit
  lasts approximately 2.5 years, totaling 7.5 years. This is one of the most
  significant transit periods in Vedic astrology and is considered a time of
  major life transformation and testing. BPHS Ch.42.

conditions:
  - entity: entity.graha.shani
    role: subject
    position: "12th, 1st, or 2nd house from Chandra (natal Moon)"
  - entity: entity.chandra
    role: object
    position: "natal Moon position"

effects:
  - description: "Major life transformation and testing period"
    intensity: strong
  - description: "Sustained challenges across personal, professional, and emotional domains"
    intensity: strong
  - description: "Forced maturity and karmic resolution"
    intensity: moderate

timing:
  onset: "When Saturn enters the 12th house from natal Moon"
  duration: "7.5 years (3 rashi transits of ~2.5 years each)"

# ── Sade Sati Phases ─────────────────────────────────────────────────────────

phases:
  - phase: "First Phase (Rising)"
    position: "12th house from Moon"
    duration: "2.5 years"
    effects:
      - "Financial expenditures and separations"
      - "Beginning of transformative pressure"
      - "Loss of comfort and familiar situations"

  - phase: "Peak Phase (Culminating)"
    position: "1st house from Moon (over natal Moon)"
    duration: "2.5 years"
    effects:
      - "Direct impact on personal identity and emotional core"
      - "Maximum intensity of Sade Sati"
      - "Health, mental peace, and self-image most affected"

  - phase: "Third Phase (Setting)"
    position: "2nd house from Moon"
    duration: "2.5 years"
    effects:
      - "Financial and family adjustments"
      - "Gradual resolution of Sade Sati pressures"
      - "Speech and family dynamics challenged"

sources:
  - ref: source.BPHS
    claim: >
      "When Sani transits through the twelfth, first, and second houses from the
      Moon, it constitutes the Sade Sati period of seven and a half years. This
      period brings significant challenges and transformation."
    confidence: high

notes: >
  Sade Sati is evaluated from the Moon, not the Lagna. The Moon sign determines
  the starting point. Sade Sati intensity varies based on Saturn's dignity in
  the transit sign, Ashtakavarga points, and Dasha running at the time.


# ── ASHTAMA SHANI ────────────────────────────────────────────────────────────

id: transit.shani.ashtama-shani
name: "Ashtama Shani — Saturn's 8th House Transit"
aliases: ["Ashtama Shani", "Saturn in 8th from Lagna"]
category: transit
status: active
confidence: high
version: 1.0
last_verified: 2026-07-15

rule_type: gochara
statement: >
  Ashtama Shani occurs when Saturn transits the 8th house from the natal
  Ascendant. This 2.5-year period is considered particularly challenging,
  bringing sudden events, health concerns, accidents, or transformative
  experiences. The 8th house governs longevity, obstacles, hidden matters,
  and transformation. BPHS Ch.42.

conditions:
  - entity: entity.graha.shani
    role: subject
    position: "8th house from Lagna"

effects:
  - description: "Sudden unexpected events and accidents"
    intensity: strong
  - description: "Health concerns requiring attention"
    intensity: strong
  - description: "Hidden obstacles and adversaries"
    intensity: moderate

timing:
  onset: "When Saturn enters the 8th house from Lagna"
  duration: "2.5 years"

sources:
  - ref: source.BPHS
    claim: >
      "When Sani is in the eighth house from the Lagna, it is called Ashtama
      Shani and brings many dangers and difficulties to the native."
    confidence: high

notes: >
  Ashtama Shani is distinct from Sade Sati. While Sade Sati is Moon-based,
  Ashtama Shani is Lagna-based. Both can occur simultaneously if Saturn
  transits the 8th from Lagna while also being in the 12th/1st/2nd from Moon.


id: transit.shani.gochara.h1
name: "Shani Gochara — 1st House"
aliases: ["Saturn Transit 1st House", "Shani in 1st from Lagna"]
category: transit
status: active
confidence: high
version: 1.0
last_verified: 2026-07-15

rule_type: gochara
statement: >
  When Saturn transits the 1st house (Lagna) from the natal Ascendant, the native
  experiences a period of self-focus, responsibility, and maturity. There may be
  physical ailments, reduced vitality, or a sense of heaviness. The native is
  compelled to confront personal limitations and develop discipline. BPHS Ch.42.

conditions:
  - entity: entity.graha.shani
    role: subject
    position: "1st house from Lagna"

effects:
  - description: "Physical fatigue, bodily ailments, sense of heaviness and responsibility"
    intensity: strong
  - description: "Period of introspection and self-discipline"
    intensity: moderate
  - description: "Reduced vitality and energy levels"
    intensity: moderate

timing:
  onset: "When Saturn enters the 1st house from Lagna"
  duration: "2.5 years"

sources:
  - ref: source.BPHS
    claim: >
      "When Sani occupies the first house from the Lagna, the person will be
      troubled by diseases and will be without happiness and pleasures."
    confidence: high

notes: "Saturn transit through the 1st house marks the beginning of a transformative period."

history:

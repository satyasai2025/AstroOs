rule_type: gochara
statement: >
  Each graha, while transiting through the 12 houses from Lagna, produces specific
  effects based on its nature (malefic/benefic), house ownership, and the domain
  of the house it occupies. This master reference provides the core signification
  of each graha's transit through each house. BPHS Ch.42.

# ── SURYA (Sun) Transit Significations ──────────────────────────────────────

graha_significations:
  surya:
    name: "Surya (Sun)"
    nature: malefic
    transit_speed: "~30 days per rashi"
    house_significations:
      h1:
        house: 1
        effect: "Self-confidence, authority, health improvements, ego issues"
        intensity: strong
      h2:
        house: 2
        effect: "Wealth gain, family matters, improved speech, authority in family"
        intensity: moderate
      h3:
        house: 3
        effect: "Courage, short journeys, sibling matters, communication"
        intensity: moderate
      h4:
        house: 4
        effect: "Domestic harmony, property matters, mother's well-being"
        intensity: moderate
      h5:
        house: 5
        effect: "Children's welfare, education, creative success, speculation"
        intensity: moderate
      h6:
        house: 6
        effect: "Victory over enemies, health concerns, service matters"
        intensity: strong
      h7:
        house: 7

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astroos"
version = "2.2.0"
description = "Official Python SDK for the AstroOS Vedic Astrology API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "AstroOS Project"}]
keywords = ["astrology", "vedic", "jyotish", "ephemeris", "horoscope", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://astroos.io"
Documentation = "https://docs.astroos.io/sdk/python"

[tool.setuptools.packages.find]
where = ["."]
include = ["astroos*"]

[tool.setuptools.package-data]
astroos = ["py.typed"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astroos-sdk"
version = "2.0.0"
description = "Official Python SDK for AstroOS Vedic Astrology API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://astroos.io"
Documentation = "https://docs.astroos.io/sdk/python"

[tool.setuptools.packages.find]
where = ["."]
# AstroOS — Alembic Configuration
# Run migrations: alembic -c database/alembic.ini upgrade head
# Generate new:   alembic -c database/alembic.ini revision --autogenerate -m "description"

[alembic]
script_location = database
version_locations = database/versions
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .

# DATABASE_URL is read from the environment in database/env.py
# Do not put credentials here — use environment variables.
sqlalchemy.url =

[post_write_hooks]
# Uncomment to auto-format migrations with ruff
# hooks = ruff
# ruff.type = exec
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# AstroOS Pre-commit Hooks Configuration
#
# Install: pip install pre-commit && pre-commit install
# Run on all files: pre-commit run --all-files
# Update hook versions: pre-commit autoupdate
#
# See docs/pre-commit-setup.md for details.

repos:
  # ── Python ──────────────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.4
    hooks:
      - id: ruff
        name: ruff-lint
        alias: ruff-lint
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff-format
        alias: ruff-format
        types_or: [python, pyi]
        stages: [pre-commit]

  # ── TypeScript / JavaScript ────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.9.1
    hooks:
      - id: eslint
        name: eslint
        alias: eslint
        files: ^apps/web/
        types: [file]
        args: [--fix, --config, apps/web/eslint.config.js]
        additional_dependencies:
          - eslint@9.9.1
          - "@eslint/js@9.9.1"
          - typescript-eslint@8.3.0
          - eslint-config-next@15.0.0
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: prettier
        alias: prettier
        files: ^apps/web/
        types_or: [javascript, jsx, typescript, tsx, css, json, yaml, markdown]
        args: [--write, --config, apps/web/.prettierrc]
        additional_dependencies:
          - prettier@3.1.0
        stages: [pre-commit]

  # ── Generic file checks ─────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: trailing-whitespace
        alias: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
      - id: end-of-file-fixer
        name: end-of-file-fixer
        alias: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        name: check-yaml
        alias: check-yaml
        args: [--allow-multiple-documents]
        stages: [pre-commit]
      - id: check-json
        name: check-json
        alias: check-json
        stages: [pre-commit]
      - id: check-added-large-files
        name: check-added-large-files
        alias: check-added-large-files
        args: [--maxkb=500]
        stages: [pre-commit]
      - id: check-merge-conflict
        name: check-merge-conflict
        alias: check-merge-conflict
        stages: [pre-commit]
      - id: detect-private-key
        name: detect-private-key
        alias: detect-private-key
        stages: [pre-commit]

  # ── Security ────────────────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: bandit
        alias: bandit
        args: [-c, pyproject.toml, -ll]
        additional_dependencies: ["bandit[toml]"]
        types: [python]
        stages: [pre-commit]

  # ── Test: fast check for modified files ────────────────────────────────
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest-fast
        alias: pytest-fast
        entry: bash -c '
          PYTHONPATH=. python -m pytest tests/unit/ -x --timeout=30 -q 2>&1 |
          tail -5
          '
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-commit]
        verbose: true

[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = ../../tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short -q
markers =
    integration: requires real external dependencies (Postgres, Redis, or a working pyswisseph install with .se1 data files). Run explicitly with `-m integration`; excluded by default in CI via `-m "not integration"`.
